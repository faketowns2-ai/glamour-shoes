// normaliza data para YYYY-MM-DD
// ─── TELEFONE (padrão Brasil: DDD + número) ─────────────────────────────────
const DDDS=new Set("11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99".split(" "));
// Chave canônica: só dígitos, DDD + número (sem 55, sem 0 na frente). Celular antigo de 8 dígitos ganha o 9.
function phoneKey(v){
  let d=String(v||"").replace(/\D/g,"").replace(/^0+/,"");
  if((d.length===12||d.length===13)&&d.startsWith("55")) d=d.slice(2);
  if(d.length===10&&/[6-9]/.test(d[2])) d=d.slice(0,2)+"9"+d.slice(2);
  return d;
}
function keyOk(k){return DDDS.has(k.slice(0,2))&&((k.length===11&&k[2]==="9")||(k.length===10&&/[2-5]/.test(k[2])));}
// Valida o número como foi digitado: celular precisa dos 11 dígitos (DDD + 9 + 8 dígitos)
function phoneValid(v){
  let d=String(v||"").replace(/\D/g,"").replace(/^0+/,"");
  if((d.length===12||d.length===13)&&d.startsWith("55")) d=d.slice(2);
  return keyOk(d);
}
function phoneFmt(v){
  const k=phoneKey(v); if(!keyOk(k)) return String(v||"");
  return `(${k.slice(0,2)}) ${k.length===11?k.slice(2,7)+"-"+k.slice(7):k.slice(2,6)+"-"+k.slice(6)}`;
}
function samePhone(a,b){const x=phoneKey(a),y=phoneKey(b);return !!x&&x===y;}
// ─── CRM SEM REPETIÇÃO ───────────────────────────────────────────────────────
// Cada cliente tem uma chave única: o celular (quando válido) ou o id do cadastro.
// Evita que um cadastro com telefone inválido seja duplicado a cada sincronização.
function crmKey(c){ const k=phoneKey(c&&c.phone); return keyOk(k)?"t"+k:"i"+String(c&&c.id); }
function dedupeCRM(list){
const m=new Map();
(Array.isArray(list)?list:[]).forEach(c=>{
if(!c) return;
const k=crmKey(c), ex=m.get(k);
if(!ex) m.set(k,c);
else if((+c.orders||0)>(+ex.orders||0)) Object.assign(ex,c);
});
return [...m.values()];
}
const PHONE_MSG="Informe o WhatsApp com DDD. Ex: (96) 99999-9999";
// Campo de telefone com máscara (96) 99999-9999
function phoneInput(value,onChange,ph="(96) 99999-9999"){
  const i=ce("input",{type:"tel",inputmode:"numeric",class:"inp",autocomplete:"tel",placeholder:ph,maxlength:"16"});
  const mask=v=>{
    let d=String(v||"").replace(/\D/g,"");
    if(d.length>11&&d.startsWith("55")) d=d.slice(2);
    d=d.slice(0,11);
    if(!d) return "";
    if(d.length<=2) return "("+d;
    const r=d.slice(2), cut=r.length>8?5:4;
    return `(${d.slice(0,2)}) `+(r.length>4?r.slice(0,cut)+"-"+r.slice(cut):r);
  };
  i.value=phoneValid(value)?phoneFmt(value):mask(value);
  i.addEventListener("input",e=>{
    const atEnd=i.selectionStart===i.value.length;
    if(atEnd&&!(e.inputType||"").startsWith("delete")) i.value=mask(i.value);
    onChange(i.value);
  });
  i.addEventListener("blur",()=>{ if(i.value) i.value=phoneValid(i.value)?phoneFmt(i.value):mask(i.value); onChange(i.value);
    i.style.borderColor=i.value&&!phoneValid(i.value)?"#e53935":""; });
  return i;
}

function ymdLocal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function monthRange(ym){const [y,m]=ym.split("-").map(Number);return {from:`${ym}-01`,to:ymdLocal(new Date(y,m,0))};}
function curMonth(){return ymdLocal(new Date()).slice(0,7);}
function normDate(o){
  if(o.date){
    const _d=new Date(o.date);
    if(/^\d{4}-\d{2}-\d{2}$/.test(o.date)) return o.date;
    if(!isNaN(_d)) return _d.toISOString().slice(0,10);
  }
  if(o.dateStr){
    const m=o.dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  }
  return "";
}

// ─── ce: cria elemento DOM ───────────────────────────────────────────────────
// ─── TEMA DO ADMIN (mesmo padrão visual do CRM Advocacia) ────────────────────
// Só vale nas telas do Admin. As cores fixas do app são convertidas para a paleta
// do CRM: fundo roxo escuro, cartões de vidro, destaque verde-limão.
let ADM=false;
const CRM={bg:"#120826",card:"#1f1240",accent:"#d4ff3a",text:"#f6f3ff",muted:"#a99fd0",
           success:"#4fd18b",danger:"#ff6b6b",info:"#6aa8ff",purple:"#a77bff",warn:"#ffb547"};
const _colRe=/#[0-9a-f]{3,8}\b|rgba?\([^)]*\)/gi;
function _rgb(v){
  v=String(v).trim();
  let m=v.match(/^#([0-9a-f]{3,8})$/i);
  if(m){ let h=m[1]; if(h.length<6) h=h.split("").map(c=>c+c).join(""); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).concat(h.length>=8?[parseInt(h.slice(6,8),16)/255]:[1]); }
  m=v.match(/^rgba?\(([^)]*)\)$/i);
  if(m){ const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(Number); return [p[0],p[1],p[2],p.length>3?p[3]:1]; }
  return null;
}
function _cls([r,g,b]){
  const mx=Math.max(r,g,b)/255, mn=Math.min(r,g,b)/255, l=(mx+mn)/2, d=mx-mn;
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(d<0.1) return {lum,pal:null};
  let h; if(mx===r/255) h=((g-b)/255/d)%6; else if(mx===g/255) h=(b-r)/255/d+2; else h=(r-g)/255/d+4;
  h=(h*60+360)%360;
  const pal=h<15||h>=350?"danger":h<50?"warn":h<70?"warn":h<170?"success":h<255?"info":h<290?"purple":"accent";  // rosa da loja vira o verde-limão do CRM
  return {lum,pal};
}
const _alpha=(hex,a)=>{ const [r,g,b]=_rgb(hex); return `rgba(${r},${g},${b},${a})`; };
function _mapCol(v,kind){
  const c=_rgb(v); if(!c) return v;
  if(c[3]<1) return kind==="bg"&&c[0]+c[1]+c[2]<60?v:kind==="border"?"rgba(255,255,255,0.09)":v;
  const {lum,pal}=_cls(c);
  if(kind==="bg"){
    if(!pal) return lum>0.6?"rgba(255,255,255,0.06)":lum<0.3?"rgba(8,2,22,0.55)":"rgba(255,255,255,0.12)";
    return lum>0.72?_alpha(CRM[pal],0.14):CRM[pal];
  }
  if(kind==="border") return pal?CRM[pal]:"rgba(255,255,255,0.09)";
  if(!pal) return lum<0.8?(lum<0.35?CRM.text:CRM.muted):CRM.text;
  return CRM[pal];
}
function admStyle(st){
  const o={...st};
  let solidBg=null;
  ["background","backgroundColor"].forEach(k=>{
    if(typeof o[k]!=="string") return;
    const only=_rgb(o[k]);
    o[k]=o[k].replace(_colRe,m=>_mapCol(m,"bg"));
    if(only&&only[3]===1) solidBg=o[k];
  });
  if(typeof o.color==="string") o.color=_mapCol(o.color,"fg");
  ["border","borderTop","borderBottom","borderLeft","borderRight","borderColor","outline"].forEach(k=>{
    if(typeof o[k]==="string") o[k]=o[k].replace(_colRe,m=>_mapCol(m,"border"));
  });
  // texto escuro sobre fundo claro do CRM (limão, verde, laranja)
  if(solidBg&&[CRM.accent,CRM.success,CRM.warn].includes(solidBg)) o.color=CRM.bg;
  if(o.boxShadow) o.boxShadow="none";
  return o;
}
function ce(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(v==null||v===false) return;
    if(k==="class") el.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(el.style,ADM?admStyle(v):v);
    else if(k==="checked"){ el.checked=!!v; }
    else if(k==="disabled"){ if(v) el.disabled=true; }
    else if(k.startsWith("on")&&typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  kids.flat(9).forEach(k=>{
    if(k==null||k===false||k===undefined) return;
    el.appendChild(typeof k==="string"||typeof k==="number"
      ? document.createTextNode(String(k)) : k);
  });
  return el;
}

// ─── OCULTAR PRODUTOS ────────────────────────────────────────────────────────
// A planilha tem colunas fixas, então o status "oculto" é gravado dentro do
// JSON da coluna stock (chave "_oculto"). Ao carregar, ele vira p.hidden.
// O preço de varejo vem da coluna "varejo" da planilha e também é guardado como
// "_varejo" no JSON de estoque (funciona mesmo antes da coluna existir).
// Link da foto limpo: quando se cola o "código de incorporação" do ImgBB vem junto
// lixo como  " alt="...  ou <img src=...>. Fica só a URL.
function limpaFoto(u){
  let s=String(u||"").trim();
  const all=s.match(/https?:\/\/[^\s"'<>]+/gi)||[];
  return all.find(x=>/\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(x)||/^https?:\/\/i\.ibb\.co\//i.test(x))||all[0]||s;
}
function normProd(p){
  if(!p) return p;
  if(p.image) p.image=limpaFoto(p.image);
  if(!p.stock) return p;
  const st={...p.stock};
  if("_oculto" in st){ p.hidden=!!st._oculto; delete st._oculto; }
  if("_varejo" in st){ const v=+st._varejo||0; delete st._varejo; if(!(+p.varejo>0)) p.varejo=v; }
  if("_promo" in st){ p.promo=+st._promo||0; delete st._promo; }
  p.stock=st;
  return p;
}
function normProds(arr){ return (arr||[]).map(normProd); }
function prodsForSheet(){
  return S.products.map(p=>{
    const {hidden,promo,...rest}=p;
    const st={...(p.stock||{})};
    if(hidden) st._oculto=1;
    if(+p.varejo>0) st._varejo=+p.varejo;
    if(promoOf(p)) st._promo=+promo;
    return {...rest,stock:st};
  });
}
function totalStock(p){ return Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0); }
async function setHidden(ids,val){
  const set=new Set(ids.map(String));
  S.products=S.products.map(p=>set.has(String(p.id))?{...p,hidden:val}:p);
  render();
  const ok=await persistProducts(true);
  toast(ok?(val?"🙈 Oculto do catálogo!":"👁 Visível no catálogo!"):"⚠️ Alterado localmente. Erro na planilha.");
  render();
}

// force=true → sobrescreve tudo (sync manual)
// force=false → só acrescenta novos, preserva locais
async function loadFromSheets(force=false){
  if(!S.scriptUrl) return false;
  if(force && window._stockDraft){
    const ok=confirm("Há alterações de estoque não salvas. Sincronizar vai descartá-las. Continuar?");
    if(!ok) return false;
    window._stockDraft=null;
  }
  if(force){ S.syncing=true; render(); }
  try{
    const res=await fetch(S.scriptUrl,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"load",token:S.token||undefined})});
    const data=await res.json();
    if(data.ok&&S.token&&!data.admin) logoutLocal("Sessão expirada. Entre de novo no Admin.");
    if(data.ok){
      if(data.afiliados){ S.afiliados=data.afiliados; lsSet("gs_afi",S.afiliados); }
      if(data.comissaoPadrao) S.comissaoPadrao=data.comissaoPadrao;
      if(data.cliques) S.cliques=data.cliques;
      if(data.saques){ S.saques=data.saques; lsSet("gs_saq",S.saques); }
      if(force){
        if(data.products&&data.products.length>0){ S.products=normProds(data.products); lsSet("gs_prod",S.products); }
        if(data.orders  &&data.orders.length>0)  { S.orders=data.orders;     lsSet("gs_ord",S.orders);   }
        if(data.crm     &&data.crm.length>0)     { S.crm=dedupeCRM(data.crm);           lsSet("gs_crm",S.crm);      }
        toast("✅ Dados recarregados da planilha!");
      } else {
        // sync silencioso: só acrescenta
        if(data.orders&&data.orders.length>0){
          const ids=new Set(S.orders.map(o=>String(o.id)));
          const novos=data.orders.filter(o=>!ids.has(String(o.id)));
          if(novos.length){ S.orders=[...novos,...S.orders]; lsSet("gs_ord",S.orders); }
          S.orders.forEach(o=>{
            const r=data.orders.find(x=>String(x.id)===String(o.id));
            if(r&&r.pago&&!o.pago) Object.assign(o,r);
            else if(r&&r.status!==o.status) o.status=r.status;
          });
          lsSet("gs_ord",S.orders);
        }
        if(data.crm&&data.crm.length>0){
          // Junta sem repetir: chave = celular válido, ou id quando o telefone é inválido
const _idx=new Map(S.crm.map(c=>[crmKey(c),c]));
data.crm.forEach(rc=>{
const k=crmKey(rc), lc=_idx.get(k);
if(!lc){ S.crm.push(rc); _idx.set(k,rc); }
else if((+rc.orders||0)>(+lc.orders||0)) Object.assign(lc,rc);
});
S.crm=dedupeCRM(S.crm);
          lsSet("gs_crm",S.crm);
        }
        if(!window._stockDraft&&data.products&&data.products.length>0){
          S.products=normProds(data.products); lsSet("gs_prod",S.products);
        }
      }
      S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); S.syncError="";
    } else {
      S.syncError=data.error||"Erro ao carregar";
      if(force) toast("⚠️ "+S.syncError,4000);
    }
  }catch(e){
    S.syncError="Sem conexão";
    if(force) toast("⚠️ Modo offline – usando dados locais",4000);
  }
  if(force){ S.syncing=false; }
  render(); return true;
}

async function _call(body){
if(body&&Array.isArray(body.crm)) body={...body,crm:dedupeCRM(body.crm)}; // nunca envia CRM repetido
  if(!S.scriptUrl) return {ok:false,error:"Sem conexão com a planilha."};
  try{
    const res=await fetch(S.scriptUrl,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({...body,token:S.token||undefined})});
    const d=JSON.parse(await res.text());
    if(d.auth===false) logoutLocal("Sessão expirada. Entre de novo no Admin.");
    return d;
  }catch(e){ return {ok:false,error:"Sem conexão. Tente de novo."}; }
}
async function _post(body){
  const d=await _call(body);
  if(d.ok){ S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); return true; }
  return false;
}
function logoutLocal(msg){
  S.token=""; S.unlocked=false; lsSet("gs_token","");
  S.orders=[]; S.crm=[]; S.afiliados=[]; S.saques=[];
  ["gs_ord","gs_crm","gs_afi","gs_saq"].forEach(k=>{ try{localStorage.removeItem(k);}catch(e){} });
  if(msg){ toast(msg,4000); if(String(S.view).startsWith("admin")) S.view="adminLogin"; render(); }
}

async function persistProducts(force=false){
  lsSet("gs_prod",S.products);
  const d=await _call({action:"saveProducts",products:prodsForSheet()});
  const ok=!!d.ok;
  if(ok){ S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); S.lastError=""; }
  else S.lastError=d.auth===false?"sessão expirada, entre de novo no Admin":(d.error||"erro na planilha");
  if(force&&!ok) toast(`⚠️ Erro na planilha: ${S.lastError}`,5000);
  render(); return ok;
}
async function persistOrders(force=false){
  lsSet("gs_ord",S.orders);
  const ok=await _post({action:"saveOrders",orders:S.orders});
  if(force&&!ok) toast("⚠️ Salvo localmente. Erro na planilha.",4000);
  render(); return ok;
}
async function persistCRM(force=false){
  lsSet("gs_crm",S.crm);
  const ok=await _post({action:"saveCRM",crm:S.crm});
  if(force&&!ok) toast("⚠️ Salvo localmente. Erro na planilha.",4000);
  render(); return ok;
}
async function syncAll(msg){
  if(!S.scriptUrl){ toast(msg||"Salvo localmente."); return; }
  S.syncing=true; render();
  const ok=await _post({action:"saveAll",products:prodsForSheet(),orders:S.orders,crm:S.crm});
  S.syncError=ok?"":"Erro ao sincronizar";
  toast(ok?(msg||"✅ Sincronizado!"):"⚠️ Salvo localmente. Erro na planilha.",ok?3000:4000);
  S.syncing=false; render();
}

// ─── BLACK FRIDAY ───────────────────────────────────────────────────────────
function bfParts(){
  let ms=Math.max(0,new Date(BF.fim).getTime()-Date.now());
  const d=Math.floor(ms/864e5); ms-=d*864e5;
  const h=Math.floor(ms/36e5);  ms-=h*36e5;
  const m=Math.floor(ms/6e4);   ms-=m*6e4;
  const s=Math.floor(ms/1e3);
  return {d,h,m,s};
}
function buildBFBar(){
  const t=bfParts(), two=n=>String(n).padStart(2,"0");
  const box=(id,val,lbl)=>ce("div",{class:"bf-box"},ce("b",{id},val),ce("span",{},lbl));
  return ce("div",{class:"bf-bar"},
    ce("div",{class:"bf-inner"},
      ce("div",{class:"bf-title"},
        ce("div",{class:"bf-kicker"},"Glamour❤️Shoes apresenta"),
        ce("div",{class:"bf-word"},"BLACK ",ce("em",{},"FRIDAY"))),
      ce("div",{class:"bf-count"},
        ce("div",{class:"bf-count-lbl"},"Termina em"),
        ce("div",{class:"bf-boxes"},
          box("bf-d",two(t.d),"dias"),box("bf-h",two(t.h),"horas"),
          box("bf-m",two(t.m),"min"),box("bf-s",two(t.s),"seg")))));
}
setInterval(()=>{
  const el=document.getElementById("bf-s");
  if(!el){ return; }
  if(!bfOn()){ render(); return; }
  const t=bfParts(), two=n=>String(n).padStart(2,"0");
  [["bf-d",t.d],["bf-h",t.h],["bf-m",t.m],["bf-s",t.s]].forEach(([id,v])=>{
    const e=document.getElementById(id); if(e&&e.textContent!==two(v)) e.textContent=two(v);
  });
},1000);

function go(v){ S.view=v; render(); }

function buildView(){
  switch(S.view){
    case "catalog":    return buildCatalog();
    case "cart":       return buildCart();
    case "checkout":   return buildCheckout();
    case "paid":       return buildPaid();
    case "adminLogin": return buildLogin();
    case "admin":      return buildAdmin();
    default:           return buildCatalog();
  }
}

  const prods=getFilteredProds();

    padding:"18px 22px",marginBottom:"20px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
    ce("div",{},
      ce("div",{style:{color:PINK,fontWeight:700,fontSize:"13px",marginBottom:"4px"}},"✨ Destaques da semana"),
      ce("div",{style:{color:"#fff",fontWeight:800,fontSize:"18px"}},"Novidades selecionadas para você!")
    ),ce("span",{style:{fontSize:"40px"}},"👠")):null;

  const srchInp=ce("input",{type:"text",class:"inp",placeholder:"🔍 Buscar produto...",

  const priceSelEl=ce("select",{class:"inp",style:{width:"auto",padding:"5px 10px"}});
  [["all","Todos"],["0-150","Até R$150"],["150-250","R$150–250"],["250+","Acima R$250"]].forEach(([v,l])=>{
    const o=ce("option",{value:v},l); if(S.fPrice===v) o.selected=true; priceSelEl.appendChild(o);
  });
  priceSelEl.addEventListener("change",e=>{S.fPrice=e.target.value;render();});

  const sortSelEl=ce("select",{class:"inp",style:{width:"auto",padding:"5px 10px"}});
  [["featured","Destaque"],["az","A–Z"],["price_asc","Menor preço"],["price_desc","Maior preço"]].forEach(([v,l])=>{
    const o=ce("option",{value:v},l); if(S.fSort===v) o.selected=true; sortSelEl.appendChild(o);
  });
  sortSelEl.addEventListener("change",e=>{S.fSort=e.target.value;render();});

  const filters=ce("div",{class:"card",style:{marginBottom:"18px"}},
    ce("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"center",marginBottom:"12px"}},
      srchInp,

          ce("button",{style:{padding:"6px 12px",borderRadius:"20px",border:"none",fontWeight:700,fontSize:"12px",

        ...sizesAvail.map(s=>ce("button",{class:"sz-btn"+(S.fSize===s?" on":""),
          onclick:()=>{S.fSize=S.fSize===s?"":s;render();}},s))
      )
    ),
    ce("div",{style:{display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"center"}},

function getFilteredProds(){
  let p=S.products.filter(x=>!x.hidden&&priceOf(x)>0&&Object.keys(x.stock||{}).length>0);
  if(S.fGender) p=p.filter(x=>x.gender===S.fGender);
  if(S.fSize)   p=p.filter(x=>(x.stock[S.fSize]||0)>0);
  if(S.fText)   p=p.filter(x=>x.name.toLowerCase().includes(S.fText.toLowerCase()));
  if(S.fPrice==="0-150")    p=p.filter(x=>priceOf(x)<150);
  if(S.fPrice==="150-250")  p=p.filter(x=>priceOf(x)>=150&&priceOf(x)<250);
  if(S.fPrice==="250+")     p=p.filter(x=>priceOf(x)>=250);
  if(S.fPromo&&!VAREJO)     p=p.filter(x=>promoOf(x)>0);
  if(S.fSort==="az")        p.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.fSort==="price_asc") p.sort((a,b)=>priceOf(a)-priceOf(b));
  if(S.fSort==="price_desc")p.sort((a,b)=>priceOf(b)-priceOf(a));
  if(S.fSort==="featured")  p.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  if(S.fProd){ const i=p.findIndex(x=>String(x.id)===S.fProd); if(i>0) p.unshift(...p.splice(i,1)); }   // produto indicado pelo afiliado primeiro
  return p;
}

function buildProductCard(p){
  const sel=S.sel[p.id]||{size:"",qty:1};
  const allSizes=Object.keys(p.stock).sort((a,b)=>+a-+b);
  const gColor=p.gender==="Masculino"?"#1565c0":p.gender==="Infantil"?"#6a1b9a":PINK;
  const gBg   =p.gender==="Masculino"?"#e3f2fd":p.gender==="Infantil"?"#f3e5f5":"#fce4ec";
  const gGrad =p.gender==="Masculino"?"linear-gradient(90deg,#90caf9,#1565c0)":
                p.gender==="Infantil"?"linear-gradient(90deg,#ce93d8,#6a1b9a)":
                                       "linear-gradient(90deg,#f48fb1,#e91e8c)";
  const img=ce("img",{src:p.image,alt:p.name,style:{width:"100%",height:"100%",objectFit:"cover"}});
  img.addEventListener("error",()=>img.style.display="none");
  const hasStock=allSizes.some(s=>(p.stock[s]||0)>0);

  const indicado=S.fProd&&String(p.id)===S.fProd;
  const promo=VAREJO?0:promoOf(p);
  return ce("div",{class:"product-card",style:indicado?{outline:`3px solid ${PINK}`}:null},
    indicado?ce("div",{style:{position:"absolute",top:"10px",right:"10px",background:"#1a1a2e",
      color:"#fff",fontSize:"11px",fontWeight:700,padding:"3px 10px",borderRadius:"12px",zIndex:1}},"💖 Indicado para você"):null,
    p.featured?ce("div",{style:{position:"absolute",top:"10px",left:"10px",background:PINK,
      color:"#fff",fontSize:"11px",fontWeight:700,padding:"3px 10px",borderRadius:"12px",zIndex:1}},"⭐ Destaque"):null,
    ce("div",{style:{height:"8px",background:gGrad}}),
    // foto quadrada 1:1
    ce("div",{style:{position:"relative",width:"100%",aspectRatio:"1/1",background:"#eee",overflow:"hidden"}},
      p.image?img:ce("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontSize:"44px"}},"👠"),
      promo?ce("div",{class:"promo-tag"},"🔥 PROMOÇÃO ",ce("b",{},`-${descPct(p)}%`)):null),
    ce("div",{style:{padding:"13px 15px"}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},
        p.code?ce("div",{style:{fontSize:"11px",color:"#aaa"}},`Cód: ${p.code}`):ce("span"),
        ce("span",{class:"badge",style:{background:gBg,color:gColor}},p.gender)
      ),
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"3px"}},p.name),
      ce("div",{style:{fontSize:"12px",color:"#777",marginBottom:"8px"}},p.desc),
      promo?ce("div",{class:"promo-price"},
          ce("span",{class:"promo-old"},fmt(p.price)),
          ce("span",{class:"promo-new"},fmt(promo)),
          ce("span",{class:"promo-save"},`economize ${fmt(+p.price-promo)}`))
        :ce("div",{style:{fontWeight:800,color:PINK,fontSize:"17px",marginBottom:"10px"}},fmt(priceOf(p))),
      ce("div",{style:{fontSize:"12px",fontWeight:600,color:"#555",marginBottom:"5px"}},"Numeração:"),
      ce("div",{style:{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"10px"}},
        ...allSizes.map(s=>{
          const zero=(p.stock[s]||0)<=0;
          const on=sel.size===s&&!zero;
          return ce("button",{
            class:"sz-btn"+(on?" on":"")+(zero?" out":""),
            disabled:zero,
            onclick:()=>{ if(!zero){S.sel[p.id]={...sel,size:s};render();} }
          },s);
        })
      ),
      sel.size?ce("div",{style:{fontSize:"11px",color:"#888",marginBottom:"8px"}},`Estoque: ${p.stock[sel.size]||0} un.`):null,
      ce("div",{style:{display:"flex",alignItems:"center",gap:"7px",marginBottom:"10px"}},
        ce("span",{style:{fontSize:"13px",fontWeight:600,color:"#555"}},"Qtd:"),
        ce("button",{class:"qty-btn",onclick:()=>{S.sel[p.id]={...sel,qty:Math.max(1,(sel.qty||1)-1)};render();}},"−"),
        ce("span",{style:{fontWeight:700,minWidth:"18px",textAlign:"center"}},sel.qty||1),
        ce("button",{class:"qty-btn",onclick:()=>{S.sel[p.id]={...sel,qty:(sel.qty||1)+1};render();}},"+")
      ),
      ce("button",{class:"btn",disabled:!hasStock,
        style:{width:"100%",padding:"9px 0",borderRadius:"30px",fontSize:"13px",
               background:hasStock?PINK:"#ccc",color:"#fff"},
        onclick:()=>addToCart(p,sel.size,sel.qty||1)},
        hasStock?"Adicionar ao Carrinho":"Sem Estoque")
    )
  );
}

function addToCart(p,size,qty){
  if(!size) return toast("Selecione um número!");
  const av=p.stock[size]||0;
  if(av<1) return toast("Sem estoque nesse número!");
  const key=`${p.id}-${size}`;
  const ex=S.cart.find(i=>i.key===key);
  const nq=(ex?ex.qty:0)+qty;
  if(nq>av) return toast("Quantidade maior que o estoque!");
  if(ex) ex.qty=nq;
  else S.cart.push({key,pid:p.id,name:p.name,code:p.code,image:p.image,size,qty,price:priceOf(p),cost:p.cost});
  S.sel[p.id]={size:"",qty:1};
  toast("Adicionado ao carrinho!"); render();
}

// ═══════════════════════════════════════════════════════════════════════════
function buildCheckout(){
  const total=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const nameInp=ce("input",{type:"text",class:"inp",placeholder:"Ex: Maria Souza"});
  nameInp.value=S.cName; nameInp.addEventListener("input",e=>{S.cName=e.target.value;S._autoName=null;});
  // Ao completar o WhatsApp, se já houver cadastro, preenche o primeiro nome (a cliente pode alterar).
  // O vínculo da compra é sempre pelo celular.
  const fillName=async v=>{
    if(!phoneValid(v)) return;
    const k=phoneKey(v); if(S._lookKey===k) return; S._lookKey=k;
    const d=await _call({action:"lookupClient",phone:k});
    if(phoneKey(S.cPhone)!==k||!d.ok||!d.nome) return;

// ─── ENDEREÇO DE ENTREGA ────────────────────────────────────────────────────
// O cliente informa no site; vai junto com o pedido para a planilha e para a InfinitePay.
const END_VAZIO={cep:"",rua:"",numero:"",bairro:"",cidade:"",uf:"",complemento:""};
S.cEnd=Object.assign({},END_VAZIO,lsGet("gs_end",{}));
function cepFmt(v){const d=String(v||"").replace(/\D/g,"").slice(0,8);return d.length>5?d.slice(0,5)+"-"+d.slice(5):d;}
function endTexto(e){
if(!e||!e.rua) return "";
return e.rua+", "+(e.numero||"s/n")+(e.complemento?" ("+e.complemento+")":"")+", "+(e.bairro||"")+", "+(e.cidade||"")+"/"+(e.uf||"")+", CEP "+cepFmt(e.cep);
}
function endPayload(){
const e=S.cEnd||{}, o={};
Object.keys(END_VAZIO).forEach(k=>{o[k]=String(e[k]||"").trim();});
o.cep=o.cep.replace(/\D/g,""); o.uf=o.uf.toUpperCase();
return (o.cep||o.rua)?o:null;
}
function endErro(){
const e=endPayload()||{};
if(String(e.cep||"").length!==8) return "Informe o CEP de entrega (8 números).";
if(!e.rua) return "Informe a rua do endereço de entrega.";
if(!e.numero) return "Informe o número da casa (ou s/n).";
if(!e.bairro) return "Informe o bairro da entrega.";
if(!e.cidade||!/^[A-Z]{2}$/.test(e.uf)) return "Informe a cidade e o estado (UF) da entrega.";
return "";
}
function buildEndCard(){
const save=()=>lsSet("gs_end",S.cEnd);
const inputs={};
const fld=(k,ph,extra)=>{
const i=ce("input",Object.assign({type:"text",class:"inp",placeholder:ph,autocomplete:"off"},extra||{}));
i.value=S.cEnd[k]||"";
i.addEventListener("input",()=>{S.cEnd[k]=i.value;save();});
inputs[k]=i; return i;
};
const box=(lbl,inp,flex)=>ce("div",{style:{flex:flex||"1 1 100%",minWidth:"0",marginBottom:"10px"}},
ce("label",{style:{fontWeight:600,fontSize:"12px",display:"block",marginBottom:"4px",color:"#555"}},lbl),inp);
const cep=fld("cep","00000-000",{inputmode:"numeric",maxlength:"9",autocomplete:"postal-code"});
const st=ce("div",{style:{fontSize:"11px",color:"#888",marginTop:"4px"}},"Digite o CEP e o endereço é preenchido sozinho.");
cep.addEventListener("input",async()=>{
cep.value=cepFmt(cep.value); S.cEnd.cep=cep.value; save();
const d=cep.value.replace(/\D/g,""); if(d.length!==8) return;
st.textContent="Buscando endereço...";
try{
const j=await (await fetch("https://viacep.com.br/ws/"+d+"/json/")).json();
if(cep.value.replace(/\D/g,"")!==d) return;
if(j.erro){ st.textContent="CEP não encontrado. Preencha o endereço abaixo."; return; }
[["rua",j.logradouro],["bairro",j.bairro],["cidade",j.localidade],["uf",j.uf]].forEach(([k,v])=>{ if(v){ S.cEnd[k]=v; inputs[k].value=v; } });
save(); st.textContent="✓ Endereço encontrado. Confira e informe o número.";
if(!inputs.numero.value) inputs.numero.focus();
}catch(x){ st.textContent="Não foi possível buscar o CEP. Preencha o endereço abaixo."; }
});
const cepBox=box("CEP",cep,"1 1 140px"); cepBox.appendChild(st);
return ce("div",{style:{border:"1.5px solid #f0e0ea",borderRadius:"12px",padding:"12px 14px 4px",marginBottom:"13px"}},
ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"2px"}},"📍 Endereço de entrega"),
ce("div",{style:{fontSize:"11px",color:"#888",marginBottom:"10px"}},"Obrigatório para pagar agora. Assim já separamos seu pedido para entrega."),
ce("div",{style:{display:"flex",flexWrap:"wrap",gap:"0 10px"}},
cepBox,
box("Rua",fld("rua","Rua, avenida...",{autocomplete:"address-line1"})),
box("Número",fld("numero","Nº ou s/n",{inputmode:"text"}),"1 1 90px"),
box("Complemento",fld("complemento","Apto, bloco, referência"),"2 1 160px"),
box("Bairro",fld("bairro","Bairro")),
box("Cidade",fld("cidade","Cidade",{autocomplete:"address-level2"}),"3 1 160px"),
box("UF",fld("uf","AP",{maxlength:"2",autocomplete:"address-level1",style:{textTransform:"uppercase"}}),"1 1 60px")));
}
function endBox(o){
const t=endTexto(o.endereco); if(!t) return null;
return ce("div",{style:{fontSize:"12px",color:"#1a1a2e",background:"#f7f0f5",borderRadius:"8px",padding:"6px 10px",margin:"4px 0 8px"}},
"📍 "+t+"  ",
ce("a",{href:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(t),target:"_blank",style:{color:"#1565c0",fontWeight:600}},"Mapa"),
" · ",
ce("a",{href:"#",style:{color:"#1565c0",fontWeight:600},onclick:e=>{e.preventDefault();try{navigator.clipboard.writeText(t);toast("Endereço copiado!");}catch(x){}}},"Copiar"));
}

function cartPayload(){
  return {mode:VAREJO?"varejo":"atacado",client:S.cName.trim(),phone:phoneKey(S.cPhone),ref:getRef(),endereco:endPayload(),
          items:S.cart.map(i=>({pid:i.pid,size:i.size,qty:i.qty}))};
}
async function doFinalize(){
  if(!S.cName.trim()) return toast("Informe o nome!");
  if(!phoneValid(S.cPhone)) return toast(PHONE_MSG,4000);
  if(S.busy) return; S.busy=true; render();
  const d=await _call({action:"createOrder",...cartPayload()});
  S.busy=false;
  if(!d.ok&&d.error&&!/conexão/i.test(d.error)){ render(); return toast(d.error,4500); }
  const total=d.ok?d.total:S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const lines=S.cart.map(i=>`• ${i.name} | Nº ${i.size} | Qtd: ${i.qty} | ${fmt(i.price*i.qty)}`).join("\n");
  const ref=getRef();
  const msg=`*Pedido Glamour❤️Shoes${VAREJO?" (VAREJO)":" (ATACADO)"}*${d.ok?` #${d.id}`:""}\n\nCliente: ${S.cName}\nWhatsApp: ${phoneFmt(S.cPhone)}${ref?`\nIndicação: ${ref}`:""}\n\n${lines}${endTexto(S.cEnd)?"\n\n📍 Entrega: "+endTexto(S.cEnd):""}\n\n*Total: ${fmt(total)}*`;
  S.cart=[]; S.cName=""; S.cPhone="";
  toast("Pedido enviado! Aguardando confirmação."); go("catalog");
  location.href=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}

async function doPay(){
  if(!S.cName.trim()) return toast("Informe o nome!");
  if(!phoneValid(S.cPhone)) return toast(PHONE_MSG,4000);
const _eErr=endErro(); if(_eErr) return toast(_eErr,4500);
  if(S.busy) return; S.busy=true; render();
  const d=await _call({action:"checkout",...cartPayload()});
  if(!d.ok||!d.url){ S.busy=false; render(); return toast(d.error||"Não foi possível gerar o pagamento.",4500); }
  lsSet("gs_lastorder",{id:d.id,total:d.total,client:S.cName,phone:phoneKey(S.cPhone),
    items:S.cart.map(i=>({name:i.name,size:i.size,qty:i.qty,price:i.price}))});
  location.href=d.url;
}

// ─── RETORNO DO PAGAMENTO ────────────────────────────────────────────────────
async function checkPaymentReturn(){
  const q=new URLSearchParams(location.search);
  const nsu=q.get("order_nsu")||q.get("pedido");
  if(!nsu||!q.get("transaction_nsu")) return;
  S.view="paid"; S.payResult={state:"checking",id:nsu}; S.cart=[]; render();
  const args={action:"confirm",order_nsu:nsu,transaction_nsu:q.get("transaction_nsu"),
    slug:q.get("slug")||"",receipt_url:q.get("receipt_url")||"",capture_method:q.get("capture_method")||""};
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  let d={};
  for(let t=0;t<4;t++){
    d=await _call(args);
    if(d.ok&&d.paid) break;
    await new Promise(r=>setTimeout(r,3000));
  }
  S.payResult={state:d.ok&&d.paid?"paid":"pending",id:nsu,order:d.order||lsGet("gs_lastorder",null),receipt:args.receipt_url,args};
  render();
}

function captureRef(){
  const r=new URLSearchParams(location.search).get("ref");
  if(r){ const c=r.toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,30); if(c){ lsSet("gs_ref",{c,exp:Date.now()+30*864e5}); contaClique(c); } }
  const pid=new URLSearchParams(location.search).get("p"); if(pid) S.fProd=String(pid).slice(0,20);
}
// 1 clique por aparelho, por afiliado, por dia (o painel mostra cliques e conversão)
function contaClique(c){
  const k=`gs_clk_${c}_${toDay()}`;
  if(lsGet(k,false)) return;
  lsSet(k,true);
  setTimeout(()=>{ _call({action:"clique",ref:c}); },800);
}
function getRef(){ const r=lsGet("gs_ref",null); return r&&r.exp>Date.now()?r.c:""; }

// Nome do cliente vinculado pelo celular (cadastro do CRM); se não houver cadastro, usa o nome digitado
function cliName(o){
  const c=keyOk(phoneKey(o.phone))?S.crm.find(x=>samePhone(x.phone,o.phone)):null;
  return (c&&String(c.name||"").trim())||o.client||"Sem nome";
}
function crmUpsert(order){
  const ex=S.crm.find(c=>samePhone(c.phone,order.phone));
  // Vínculo pelo celular: o nome do cadastro é mantido, mesmo que o cliente digite o nome diferente
  if(ex){ if(!String(ex.name||"").trim()) ex.name=order.client; ex.pending=(ex.pending||0)+1; ex.lastOrder=order.date; }
  else S.crm.push({id:Date.now()+Math.random(),name:order.client,phone:order.phone,
                   orders:0,pending:1,lastOrder:order.date,since:order.date});
}

function mkBadge(status){
  const M={confirmed:["Confirmado","#e8f5e9","#2e7d32"],cancelled:["Cancelado","#ffebee","#c62828"],pending:["Aguardando","#fff3e0","#e65100"]};
  const[label,bg,color]=M[status]||M.pending;
  return ce("span",{class:"badge",style:{background:bg,color}},label);
}

async function confirmOrder(id){
  const o=S.orders.find(x=>x.id===id);
  if(!o||o.status!=="pending") return;
  o.items.forEach(item=>{
    const p=S.products.find(x=>x.id===item.pid||x.id===item.productId);
    if(p&&p.stock[item.size]!==undefined) p.stock[item.size]=Math.max(0,(p.stock[item.size]||0)-item.qty);
  });
  o.status="confirmed";
  if(o.ref&&!o.comissao){ const a=S.afiliados.find(x=>x.codigo===o.ref); if(a) o.comissao=Math.round(o.total*(+a.comissao||0))/100; }
  const c=S.crm.find(x=>samePhone(x.phone,o.phone));
  if(c){c.orders=(c.orders||0)+1;c.pending=Math.max(0,(c.pending||1)-1);c.lastOrder=o.date;}
  lsSet("gs_prod",S.products); lsSet("gs_ord",S.orders); lsSet("gs_crm",S.crm);
  render();
  S.syncing=true; render();
  const ok=await _post({action:"saveAll",products:prodsForSheet(),orders:S.orders,crm:S.crm});
  S.syncing=false;
  toast(ok?"✅ Pedido confirmado! Estoque atualizado na planilha.":"✅ Confirmado localmente. ⚠️ Erro na planilha.",ok?3000:5000);
  render();
}

// ─── CRM ─────────────────────────────────────────────────────────────────────
// ─── CRM: mensagens em massa (uma por uma no WhatsApp) ───────────────────────
function isoData(v){
  const t=String(v||"").trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[0];
  if((m=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/))) return `${m[3]}-${m[2]}-${m[1]}`;
  const d=new Date(t); return isNaN(d)?"":ymdLocal(d);
}
function crmInfo(c){
  const conf=S.orders.filter(o=>o.status==="confirmed"&&samePhone(o.phone,c.phone));
  let ult=conf.reduce((u,o)=>{ const d=isoData(o.date)||isoData(o.dateStr); return d>u?d:u; },"");
  const compras=Math.max(conf.length,+c.orders||0);
  if(!ult&&compras>0) ult=isoData(c.lastOrder);
  const dias=ult?Math.round((new Date(ymdLocal(new Date())+"T12:00:00")-new Date(ult+"T12:00:00"))/864e5):null;
  return {compras,ult,dias,gasto:conf.reduce((a,o)=>a+(+o.total||0),0)};
}
const CRM_ENV_KEY="gs_crm_env";
const crmEnviados=()=>lsGet(CRM_ENV_KEY,{});
function marcaEnviado(phone){ const e=crmEnviados(); e[phoneKey(phone)]=toDay(); lsSet(CRM_ENV_KEY,e); }
function msgPara(c,txt){
  const primeiro=String(c.name||"").trim().split(/\s+/)[0]||"";
  return String(txt||"").replace(/\{nome\}/g,primeiro).replace(/\{nome_completo\}/g,String(c.name||"").trim())
    .replace(/\{link\}/g,CATALOG_URL).replace(/\{varejo\}/g,`${CATALOG_URL}/varejo`);
}
function buildCRM(){
  if(!S.crmSel) S.crmSel=[];
  if(!S.crmF) S.crmF={tipo:"todos",busca:"",recente:7,inativo:30};
  if(S.crmMsg===undefined) S.crmMsg=TPLS[0].text.replace("{nome}","{nome}");
  const F=S.crmF, sel=S.crmSel, env=crmEnviados(), hoje=toDay();
  const lista0=S.crm.map(c=>({c,i:crmInfo(c),ok:keyOk(phoneKey(c.phone))}));
  const cat=x=>x.i.compras===0?"nao":x.i.dias!=null&&x.i.dias<=F.inativo?"ativo":"inativo";
  const cont={todos:lista0.length,ativos:lista0.filter(x=>cat(x)==="ativo").length,inativos:lista0.filter(x=>cat(x)==="inativo").length,
    recente:lista0.filter(x=>x.i.dias!=null&&x.i.dias<=F.recente).length,nao:lista0.filter(x=>cat(x)==="nao").length};
  let lista=lista0.filter(x=>F.tipo==="todos"||(F.tipo==="ativos"&&cat(x)==="ativo")||(F.tipo==="inativos"&&cat(x)==="inativo")||
    (F.tipo==="recente"&&x.i.dias!=null&&x.i.dias<=F.recente)||(F.tipo==="nao"&&cat(x)==="nao"));
  if(F.busca) lista=lista.filter(x=>(x.c.name+" "+x.c.phone).toLowerCase().includes(F.busca.toLowerCase())||phoneKey(x.c.phone).includes(phoneKey(F.busca)||"@"));
  lista.sort((a,b)=>(b.i.ult||"").localeCompare(a.i.ult||"")||String(a.c.name).localeCompare(String(b.c.name)));
  const key=c=>crmKey(c);
  const escolhidos=sel.map(k=>lista0.find(x=>key(x.c)===k)).filter(Boolean);
  const marca=(x,on)=>{ if(!x.ok) return; const k=key(x.c), i=sel.indexOf(k); if(on&&i<0) sel.push(k); if(!on&&i>=0) sel.splice(i,1); };
  const sm=(bg,c)=>({padding:"6px 12px",fontSize:"11px",background:bg,color:c});
  const badgeSit=x=>{ const t=cat(x);
    return t==="nao"?ce("span",{class:"badge",style:{background:"#eceff1",color:"#546e7a"}},"Não comprou")
      :t==="ativo"?ce("span",{class:"badge",style:{background:"#e8f5e9",color:"#2e7d32"}},x.i.dias<=F.recente?"Comprou recente":"Ativo")

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function buildDash(){
  const fOrd=S.orders.filter(o=>{
    if(o.status==="cancelled") return false;
    let oDate=normDate(o);
    if(S.dFrom&&oDate<S.dFrom) return false;
    if(S.dTo  &&oDate>S.dTo)   return false;
    return true;
  });
  const conf=fOrd.filter(o=>o.status==="confirmed");
  const pend=S.orders.filter(o=>o.status==="pending");
  const rev=conf.reduce((s,o)=>s+o.total,0);
  const cst=conf.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.cost||0)*i.qty,0),0);
  const prf=rev-cst;
  const mrg=rev>0?(prf/rev*100).toFixed(1):0;
  const avg=conf.length>0?rev/conf.length:0;

  const byProd={};
  conf.forEach(o=>o.items.forEach(i=>{
    if(!byProd[i.name]) byProd[i.name]={name:i.name,qty:0,rev:0,prf:0};
    byProd[i.name].qty+=i.qty; byProd[i.name].rev+=i.price*i.qty;
    byProd[i.name].prf+=(i.price-(i.cost||0))*i.qty;
  }));
  const bp=Object.values(byProd).sort((a,b)=>b.rev-a.rev);

  const ordCost=o=>o.items.reduce((ss,i)=>ss+(i.cost||0)*i.qty,0);
  const allConf=S.orders.filter(o=>o.status==="confirmed");
  const sumRange=(from,to)=>{
    const os=allConf.filter(o=>{const d=normDate(o);return d>=from&&d<=to;});
    const r=os.reduce((s,o)=>s+o.total,0);
    return {n:os.length,rev:r,prf:r-os.reduce((s,o)=>s+ordCost(o),0)};
  };
  const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymdLocal(d);};
  const w7=sumRange(dAgo(6),dAgo(0)), w7prev=sumRange(dAgo(13),dAgo(7));
  const w7var=w7prev.rev>0?((w7.rev-w7prev.rev)/w7prev.rev*100):null;

  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=ymdLocal(d);
    const label=d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
    const value=allConf.filter(o=>normDate(o)===key).reduce((s,o)=>s+o.total,0);
    days.push({label,value});
  }

  // Top 10 compradores no período
  const byCli={};
  conf.forEach(o=>{
    const k=phoneKey(o.phone)||String(o.client||"").trim().toLowerCase()||"sem-nome";
    if(!byCli[k]) byCli[k]={name:cliName(o),phone:o.phone||"",n:0,rev:0,prf:0};
    byCli[k].n++; byCli[k].rev+=o.total; byCli[k].prf+=o.total-ordCost(o);
  });
  const topCli=Object.values(byCli).sort((a,b)=>b.rev-a.rev).slice(0,10);
  const topRev=topCli.reduce((s,c)=>s+c.rev,0);

  // Mês de referência
  const months=[...new Set([curMonth(),...S.orders.map(o=>normDate(o).slice(0,7)).filter(Boolean)])].sort().reverse();
  const curSel=months.find(m=>{const r=monthRange(m);return S.dFrom===r.from&&S.dTo===r.to;})||(!S.dFrom&&!S.dTo?"all":"custom");
  const monthSel=ce("select",{class:"inp",style:{width:"auto",padding:"5px 10px"}},
    ...months.map(m=>{const [y,mm]=m.split("-");const lb=new Date(+y,+mm-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
      return ce("option",{value:m},lb.charAt(0).toUpperCase()+lb.slice(1));}),
    ce("option",{value:"all"},"Todo o período"),
    curSel==="custom"?ce("option",{value:"custom"},"Personalizado"):null);
  monthSel.value=curSel;
  monthSel.addEventListener("change",e=>{const v=e.target.value;
    if(v==="all"){S.dFrom="";S.dTo="";} else if(v!=="custom"){const r=monthRange(v);S.dFrom=r.from;S.dTo=r.to;}
    render();});
  const maxV=Math.max(...days.map(d=>d.value),1);

  const dFromInp=ce("input",{type:"date",class:"inp",style:{width:"auto",padding:"5px 10px"}});
  dFromInp.value=S.dFrom; dFromInp.addEventListener("change",e=>{S.dFrom=e.target.value;render();});
  const dToInp=ce("input",{type:"date",class:"inp",style:{width:"auto",padding:"5px 10px"}});
  dToInp.value=S.dTo; dToInp.addEventListener("change",e=>{S.dTo=e.target.value;render();});
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(CATALOG_URL)}`;

  return ce("div",{},
    ce("h3",{style:{marginBottom:"14px",fontSize:"17px"}},"📊 Dashboard"),
    ce("div",{class:"card",style:{display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"center",marginBottom:"14px"}},
      ce("label",{style:{fontSize:"13px",fontWeight:600,display:"flex",alignItems:"center",gap:"6px"}},"Mês de referência:",monthSel),
      ce("label",{style:{fontSize:"13px",fontWeight:600,display:"flex",alignItems:"center",gap:"6px"}},"De:",dFromInp),
      ce("label",{style:{fontSize:"13px",fontWeight:600,display:"flex",alignItems:"center",gap:"6px"}},"Até:",dToInp),
      ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:"#eee",color:"#1a1a2e"},
        onclick:()=>{const r=monthRange(curMonth());S.dFrom=r.from;S.dTo=r.to;render();}},"Mês atual"),
      (()=>{const hj=ymdLocal(new Date());const on=S.dFrom===hj&&S.dTo===hj;
        return ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:on?PINK:"#eee",color:on?"#fff":"#1a1a2e"},
          onclick:()=>{S.dFrom=hj;S.dTo=hj;render();}},"Hoje");})()),
    ce("div",{class:"card",style:{marginBottom:"18px",background:"linear-gradient(135deg,#fff0f6,#fff)",border:`1px solid ${PINK}33`}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"6px",marginBottom:"10px"}},
        ce("div",{style:{fontWeight:700,fontSize:"14px"}},"🗓 Vendas dos últimos 7 dias"),
        w7var===null?null:ce("span",{style:{fontSize:"12px",fontWeight:700,padding:"3px 10px",borderRadius:"20px",
          background:w7var>=0?"#e8f5e9":"#fce4ec",color:w7var>=0?"#2e7d32":"#c62828"}},
          `${w7var>=0?"▲":"▼"} ${Math.abs(w7var).toFixed(0)}% vs 7 dias anteriores`)),
      ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:"10px"}},
        ...[["Faturamento",fmt(w7.rev),"#1565c0"],["Lucro",fmt(w7.prf),"#2e7d32"],["Pedidos",w7.n,"#f57f17"],
            ["Ticket médio",fmt(w7.n?w7.rev/w7.n:0),"#6a1b9a"]].map(([l,v,c])=>
          ce("div",{},ce("div",{style:{fontSize:"11px",color:"#666"}},l),ce("div",{style:{fontWeight:800,fontSize:"18px",color:c}},v))))),
    ce("div",{class:"kpi-grid",style:{marginBottom:"18px"}},
      mkKPI("💰","Faturamento",fmt(rev),"#e3f2fd","#1565c0"),
      mkKPI("🏷","Custo Total",fmt(cst),"#fce4ec","#c62828"),
      mkKPI("📈","Lucro",fmt(prf),"#e8f5e9","#2e7d32"),
      mkKPI("📊","Margem",`${mrg}%`,"#f3e5f5","#6a1b9a"),
      mkKPI("🎯","Ticket Médio",fmt(avg),"#e8f5e9","#1b5e20"),
      mkKPI("✅","Confirmados",conf.length,"#fff8e1","#f57f17"),
      mkKPI("⏳","Pendentes",pend.length,"#fff3e0","#e65100"),
      mkKPI("👥","Clientes",S.crm.length,"#e8eaf6","#283593")
    ),
    ce("div",{class:"card",style:{marginBottom:"18px"}},
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"14px"}},"Faturamento — últimos 7 dias"),

const INV_DIAS=30;          // janela de vendas para giro e cobertura
const INV_PARADO=60;        // sem venda há tantos dias = estoque parado
function invAnalise(stockOf){
  const hoje=ymdLocal(new Date());
  const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymdLocal(d);};
  const ini=dAgo(INV_DIAS-1);
  const conf=S.orders.filter(o=>o.status==="confirmed");
  const vend={};   // por produto: pares na janela, última venda, pares por número
  const chave=i=>String(i.pid!=null?i.pid:"")||("n:"+i.name);
  conf.forEach(o=>{ const d=normDate(o); (o.items||[]).forEach(i=>{
    const k=chave(i); const v=vend[k]||(vend[k]={q:0,ult:"",tam:{}});
    if(d>=ini&&d<=hoje){ v.q+=+i.qty||0; v.tam[i.size]=(v.tam[i.size]||0)+(+i.qty||0); }
    if(d>v.ult) v.ult=d;
  }); });
  const diasDesde=d=>d?Math.round((new Date(hoje+"T12:00:00")-new Date(d+"T12:00:00"))/864e5):null;
  const rows=S.products.map(p=>{
    const st=stockOf(p), pares=Object.values(st).reduce((a,q)=>a+(+q||0),0);
    const v=vend[String(p.id)]||vend["n:"+p.name]||{q:0,ult:"",tam:{}};
    const cost=+p.cost||0, atac=+p.price||0, var_=+p.varejo||0;
    const ritmo=v.q/INV_DIAS;                                   // pares por dia
    const cobertura=pares>0?(ritmo>0?Math.round(pares/ritmo):Infinity):0;
    const semVenda=diasDesde(v.ult);
    const furos=Object.entries(st).filter(([sz,q])=>!(+q>0)&&(v.tam[sz]||0)>0).map(([sz])=>sz);  // vendeu e zerou
    return {p,st,pares,cost,atac,var_,vCusto:pares*cost,vAtac:pares*atac,vVar:pares*var_,vend30:v.q,ult:v.ult,semVenda,
            cobertura,furos,parado:pares>0&&(semVenda===null||semVenda>=INV_PARADO)};
  });
  const soma=f=>rows.reduce((a,r)=>a+f(r),0);
  const pares=soma(r=>r.pares), vCusto=soma(r=>r.vCusto), vAtac=soma(r=>r.vAtac);
  const comVar=rows.filter(r=>r.var_>0);
  const vVar=soma(r=>r.vVar), custoComVar=comVar.reduce((a,r)=>a+r.vCusto,0);
  const vend30=soma(r=>r.vend30);
  const tam={}; rows.forEach(r=>Object.entries(r.st).forEach(([sz,q])=>{ tam[sz]=(tam[sz]||0)+(+q||0); }));
  const vendTam={}; Object.values(vend).forEach(v=>Object.entries(v.tam).forEach(([sz,q])=>{ vendTam[sz]=(vendTam[sz]||0)+q; }));
  const gen={}; rows.forEach(r=>{ const g=r.p.gender||"Outros"; const x=gen[g]||(gen[g]={pares:0,custo:0,modelos:0}); x.pares+=r.pares; x.custo+=r.vCusto; if(r.pares>0) x.modelos++; });
  return {rows,pares,vCusto,vAtac,vVar,custoComVar,vend30,tam,vendTam,gen,
    modelos:rows.filter(r=>r.pares>0).length, esgotados:rows.filter(r=>r.pares===0&&!r.p.hidden),
    semCusto:rows.filter(r=>r.pares>0&&!(r.cost>0)), semVarejo:rows.filter(r=>r.pares>0&&!(r.var_>0)&&!r.p.hidden),
    parados:rows.filter(r=>r.parado), baixo:rows.filter(r=>r.pares>0&&r.pares<=2&&!r.p.hidden),
    furos:rows.filter(r=>r.furos.length), ocultosComEstoque:rows.filter(r=>r.p.hidden&&r.pares>0),
    custoMedio:pares>0?vCusto/pares:0, giroDias:vend30>0?Math.round(pares/(vend30/INV_DIAS)):null};
}

function buildStock(){
  if(!window._stockDraft) window._stockDraft=S.products.map(p=>({id:p.id,stock:{...p.stock}}));
  function getDraft(pid){ return window._stockDraft.find(d=>d.id===pid); }

  let hasChanges=false;
  S.products.forEach(p=>{
    const draft=getDraft(p.id); if(!draft) return;
    Object.entries(draft.stock).forEach(([sz,q])=>{ if(q!==(p.stock[sz]||0)) hasChanges=true; });
  });

  const A=invAnalise(p=>(getDraft(p.id)||{stock:p.stock}).stock);
  if(!S.invFiltro) S.invFiltro="todos"; if(!S.invOrdem) S.invOrdem="nome";
  const filtros={todos:()=>true,parados:r=>r.parado,baixo:r=>r.pares>0&&r.pares<=2,reposicao:r=>r.furos.length>0,esgotados:r=>r.pares===0};
  const ordens={nome:(a,b)=>a.p.name.localeCompare(b.p.name),custo:(a,b)=>b.vCusto-a.vCusto,pares:(a,b)=>b.pares-a.pares,
                vendas:(a,b)=>b.vend30-a.vend30,cobertura:(a,b)=>(b.cobertura===Infinity?1e9:b.cobertura)-(a.cobertura===Infinity?1e9:a.cobertura)};
  const listaInv=A.rows.filter(filtros[S.invFiltro]||filtros.todos).sort(ordens[S.invOrdem]||ordens.nome);

  async function saveStock(){
    window._stockDraft.forEach(draft=>{
      const p=S.products.find(x=>x.id===draft.id);
      if(p) p.stock={...draft.stock};
    });
    lsSet("gs_prod",S.products); window._stockDraft=null; render();
    const ok=await persistProducts(true);
    toast(ok?"✅ Estoque salvo e sincronizado!":"✅ Salvo localmente. ⚠️ Verifique a conexão."); render();

  return ce("div",{},

          onclick:()=>loadFromSheets(true)},"🔄 Sincronizar"):null,
        hasChanges?ce("button",{class:"btn",style:{padding:"8px 18px",fontSize:"13px",borderRadius:"22px",background:"#e53935",color:"#fff"},
          onclick:()=>{window._stockDraft=null;render();}},"Descartar"):null,
        ce("button",{class:"btn",style:{padding:"8px 18px",fontSize:"13px",borderRadius:"22px",background:"#4caf50",color:"#fff"},
          onclick:saveStock},"💾 Salvar estoque")
      )
    ),

// ─── AFILIADOS ───────────────────────────────────────────────────────────────
function afiStats(a){
  const ords=S.orders.filter(o=>o.ref===a.codigo&&o.status!=="cancelled");
  const conf=ords.filter(o=>o.status==="confirmed");
  const com=o=>+o.comissao||Math.round(o.total*(+a.comissao||0))/100;
  const aPagar=conf.filter(o=>!o.comissaoPaga);
  return {pedidos:ords.length,vendas:conf.length,faturado:conf.reduce((s,o)=>s+o.total,0),
          comissaoTotal:conf.reduce((s,o)=>s+com(o),0),aPagar:aPagar.reduce((s,o)=>s+com(o),0),aPagarOrds:aPagar};
}
async function saveAfiliados(msg){
  lsSet("gs_afi",S.afiliados);
  const ok=await _post({action:"saveAfiliados",afiliados:S.afiliados});
  toast(ok?(msg||"✅ Afiliados salvos!"):"⚠️ Erro ao salvar na planilha.",ok?3000:4500); render();
}
function slugAfi(nome){
  const base=nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,16)||"afiliado";
  let c=base,n=2; while(S.afiliados.some(a=>a.codigo===c)) c=base+(n++);
  return c;
}

    `Sua comissão: ${a.comissao}% sobre cada venda paga pelo seu link.\n\n`+

async function aprovarAfi(a){
  if(!confirm(`Aprovar ${a.nome} com comissão de ${a.comissao}%?`)) return;
  const w=a.whatsapp?window.open("about:blank","_blank"):null;   // abre já, para o navegador não bloquear
  a.status="aprovado"; a.ativo=true;
  lsSet("gs_afi",S.afiliados);
  const ok=await _post({action:"saveAfiliados",afiliados:S.afiliados});
  if(!ok){ if(w) w.close(); a.status="pendente"; a.ativo=false; toast("⚠️ Erro ao salvar na planilha.",4500); render(); return; }
  await loadFromSheets(false);                       // traz a chave do painel
  const x=S.afiliados.find(z=>z.codigo===a.codigo)||a;
  if(w) w.location.href=waBoasVindas(x);

async function loadAfiPanel(){
  const chave=location.hash.replace(/^#/,"").trim();
  if(!chave){ S.afi={state:"erro",error:"Link incompleto. Peça o link do seu painel para a loja."}; render(); return; }
  S.afi={...(S.afi||{}),state:S.afi&&S.afi.data?"ok":"loading"}; render();
  const [d,cat]=await Promise.all([_call({action:"afiliadoPainel",chave}),_call({action:"load"})]);
  if(cat&&cat.ok&&cat.products) S.products=normProds(cat.products);
  S.afi=d.ok?{state:"ok",data:d,chave}:{state:"erro",error:d.error||"Não foi possível carregar o painel."};
  render();
}

const tamsDe=p=>Object.keys(p.stock||{}).filter(k=>(+p.stock[k]||0)>0).sort((a,b)=>+a-+b);
const linkProd=p=>`${CATALOG_URL}/?p=${encodeURIComponent(p.id)}`;

const SH_CAMPOS=[["nome","Nome"],["preco","Preço"],["num","Numeração"],["link","Link do produto"],["desc","Descrição"]];
function shCampos(){
  if(!S.shCampos) S.shCampos=Object.assign({nome:true,preco:true,num:true,link:true,desc:true},lsGet("gs_sh_campos",{}));
  return S.shCampos;
}
function legendaAtacado(p){
  const c=shCampos(), t=tamsDe(p), desc=String(p.desc||"").trim();
  const pr=promoOf(p);
  return [c.preco&&pr?`🔥🔥 *PROMOÇÃO -${descPct(p)}%* 🔥🔥`:null,
          c.nome?`*${String(p.name||"").trim().toUpperCase()}*`:null,
          c.preco?(pr?`💰 Atacado: de ~${fmt(p.price)}~ por *${fmt(pr)}*`:`💰 Atacado: ${fmt(p.price)}`):null,
          c.num?`📏 Numeração: ${t.length?t.join(", "):"consulte"}`:null,
          c.link?`🛒 ${linkProd(p)}`:null,
          c.desc&&desc?`📝 ${desc}`:null].filter(Boolean).join("\n");
}
async function arquivoFoto(p){
  if(!p.image) return null;
  try{ const b=await (await fetch(p.image,{mode:"cors"})).blob();
    const ext=(b.type.split("/")[1]||"jpg").replace("jpeg","jpg");
    return new File([b],`${(p.code||p.id)}-${String(p.name).replace(/[^a-z0-9]+/gi,"-").slice(0,40)}.${ext}`,{type:b.type||"image/jpeg"}); }
  catch(e){ return null; }
}
async function copiaTexto(t,msg){ try{ await navigator.clipboard.writeText(t); toast(msg); return true; }catch(e){ prompt("Copie:",t); return false; } }
async function compartilhaUm(p){
  const text=legendaAtacado(p);
  if(text) await copiaTexto(text,"📋 Legenda copiada");  // se o app ignorar o texto, é só colar
  const f=await arquivoFoto(p);
  const podeArquivo=f&&navigator.canShare&&navigator.canShare({files:[f]});
  if(navigator.share&&(podeArquivo||text)){
    try{ await navigator.share(podeArquivo?(text?{files:[f],text}:{files:[f]}):{text}); return true; }
    catch(e){ if(e&&e.name==="AbortError") return false; }
  }
  if(!text){ // sem legenda e o aparelho não compartilha arquivo: baixa a foto
    if(f){ const a=ce("a",{href:URL.createObjectURL(f),download:f.name}); document.body.appendChild(a); a.click(); a.remove(); toast("⬇ Foto baixada"); }
    else if(p.image) window.open(p.image,"_blank");
    return true;
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank"); return true;
}
async function baixaFotos(lista){
  let ok=0;
  for(const p of lista){
    const f=await arquivoFoto(p);
    if(f){ const a=ce("a",{href:URL.createObjectURL(f),download:f.name}); document.body.appendChild(a); a.click(); a.remove(); ok++; await new Promise(r=>setTimeout(r,350)); }
    else if(p.image) window.open(p.image,"_blank");

}

// ─── CATÁLOGO EM PDF (gerado no navegador, sem servidor) ─────────────────────
function carregaJsPDF(){
  if(window.jspdf) return Promise.resolve();
  if(window._pdfP) return window._pdfP;
  return window._pdfP=new Promise((ok,no)=>{ const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"; sc.onload=ok; sc.onerror=()=>{window._pdfP=null;no();}; document.head.appendChild(sc); });
}
// foto quadrada (recorte central) em JPEG leve, para o PDF não ficar pesado
async function fotoQuadrada(url,px=520,ratio=1){
  if(!url) return null;
  try{
    const b=await (await fetch(url,{mode:"cors"})).blob();
    const bmp=await createImageBitmap(b);
    const c=document.createElement("canvas"); c.width=px; c.height=Math.round(px*ratio);   // ratio = altura/largura
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
    let sw=bmp.width, sh=sw*ratio; if(sh>bmp.height){ sh=bmp.height; sw=sh/ratio; }
    g.drawImage(bmp,(bmp.width-sw)/2,(bmp.height-sh)/2,sw,sh,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.78);
  }catch(e){ return null; }
}
function pdfProdutos(escolhidos,todos,o){
  let l=(o.origem==="sel"&&escolhidos.length?escolhidos:todos.filter(p=>tamsDe(p).length>0)).slice();
  if(o.preco==="varejo") l=l.filter(p=>(+p.varejo||0)>0);
  if(o.genero) l=l.filter(p=>p.gender===o.genero);
  if(o.tam) l=l.filter(p=>(+((p.stock||{})[o.tam])||0)>0);
  if(o.origem!=="sel") l.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)||String(a.name).localeCompare(String(b.name)));
  return l;
}
async function geraCatalogoPDF(lista,o,progresso){
  await carregaJsPDF();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=10, ROSA=[233,30,140], ESC=[26,26,46], CINZA=[110,110,120];
  const hoje=new Date().toLocaleDateString("pt-BR");
  const waFmt=phoneFmt(WA.replace(/^55/,""));
  const base=o.preco==="varejo"?`${CATALOG_URL}/varejo`:`${CATALOG_URL}/`;
  const sep=base.includes("?")?"&":"?";
  const IMG_R=52/((W-2*M-10)/3);
  // fotos em paralelo (4 por vez)
  const fotos=new Array(lista.length); let feitas=0;
  for(let i=0;i<lista.length;i+=4){
    await Promise.all(lista.slice(i,i+4).map(async(p,k)=>{ fotos[i+k]=await fotoQuadrada(p.image,520,IMG_R); feitas++; progresso&&progresso(feitas,lista.length); }));
  }
  const capa=()=>{
    doc.setFillColor(...ESC); doc.rect(0,0,W,46,"F");

    const wl=`https://wa.me/${WA}`; doc.setTextColor(...ROSA); doc.textWithLink("Falar no WhatsApp",W-M-30,54,{url:wl});
    return 59;
  };
  const topo=()=>{
    doc.setFillColor(...ESC); doc.rect(0,0,W,13,"F"); doc.setFillColor(...ROSA); doc.rect(0,13,W,0.8,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text("GLAMOUR SHOES",M,8.6);

    if(col===0&&y+CH>H-14){ doc.addPage(); y=topo(); }
    const x=M+col*(CW+GAP), url=`${base}${sep}p=${encodeURIComponent(p.id)}`;
    doc.setDrawColor(235,225,232); doc.setFillColor(255,255,255); doc.roundedRect(x,y,CW,CH,2.5,2.5,"FD");

    else { doc.setFillColor(245,240,244); doc.rect(x+0.4,y+0.4,CW-0.8,IMG-0.8,"F"); doc.setTextColor(...CINZA); doc.setFontSize(8); doc.text("sem foto",x+CW/2,y+IMG/2,{align:"center"}); }
    doc.link(x,y,CW,IMG,{url});

    const prPdf=o.preco==="atacado"||o.preco==="ambos"?promoOf(p):0;
    if(prPdf){ doc.setFillColor(255,61,0); doc.roundedRect(x+CW-25,y+2,23,4.6,1.2,1.2,"F"); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(6.2); doc.text(`PROMOCAO -${descPct(p)}%`,x+CW-13.5,y+5.2,{align:"center"}); }
    let ty=y+IMG+4.2;
    doc.setTextColor(...ESC); doc.setFont("helvetica","bold"); doc.setFontSize(8.2);
    const nome=doc.splitTextToSize(String(p.name||"").toUpperCase(),CW-4).slice(0,2);
    doc.text(nome,x+2,ty); ty+=nome.length*3.4+1.2;
    doc.setTextColor(...ROSA); doc.setFontSize(11);
    if(o.preco==="sem"){ ty-=5; }
    else if(prPdf){ doc.text(fmt(prPdf),x+2,ty+1); const w=doc.getTextWidth(fmt(prPdf)); doc.setFontSize(7.5); doc.setTextColor(...CINZA); doc.setFont("helvetica","normal");
      const ant=fmt(p.price), wa=doc.getTextWidth(ant); doc.text(ant,x+4+w,ty+1); doc.setDrawColor(...CINZA); doc.setLineWidth(0.25); doc.line(x+4+w,ty,x+4+w+wa,ty);

    else if(o.preco==="ambos"){ doc.text(fmt(p.price),x+2,ty+1); if(+p.varejo>0){ doc.setFontSize(7); doc.setTextColor(...CINZA); doc.setFont("helvetica","normal"); doc.text(`varejo ${fmt(p.varejo)}`,x+CW-2,ty+1,{align:"right"}); } }
    else doc.text(fmt(o.preco==="varejo"?p.varejo:p.price),x+2,ty+1);
    ty+=5;
    doc.setFont("helvetica","normal"); doc.setFontSize(7); doc.setTextColor(70,70,80);
    const t=tamsDe(p); doc.text(doc.splitTextToSize(`Nº ${t.length?t.join(", "):"consulte"}`,CW-4).slice(0,1),x+2,ty); ty+=3.3;
    const desc=String(p.desc||"").trim();
    if(desc){ doc.setTextColor(...CINZA); doc.setFontSize(6.4); doc.text(doc.splitTextToSize(desc,CW-4).slice(0,2),x+2,ty); }
    doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(...ROSA);
    doc.textWithLink("Ver no site >",x+2,y+CH-2.6,{url});
    if(p.code){ doc.setFont("helvetica","normal"); doc.setTextColor(...CINZA); doc.text(`cód. ${p.code}`,x+CW-2,y+CH-2.6,{align:"right"}); }
    col++; if(col===COLS){ col=0; y+=CH+GAP; }
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...CINZA);
    doc.text(`Glamour Shoes  |  WhatsApp ${waFmt}  |  Preços e estoque sujeitos a alteração`,M,H-6);
    doc.text(`${i}/${n}`,W-M,H-6,{align:"right"}); }
  const slug=o.cliente?"-"+o.cliente.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").toLowerCase():"";
  return {blob:doc.output("blob"),nome:`catalogo-glamour${slug}-${toDay()}.pdf`};
}
function buildPdfCard(escolhidos,todos){
  if(!S.pdf) S.pdf={titulo:"Catálogo de calçados",cliente:"",preco:"atacado",origem:"todos",genero:"",tam:"",estado:"",prog:""};
  const o=S.pdf;
  if(o.origem==="sel"&&!escolhidos.length) o.origem="todos";
  const qtd=pdfProdutos(escolhidos,todos,o).length;
  const lbl=t=>ce("label",{style:{fontWeight:600,fontSize:"12px",display:"block",marginBottom:"4px"}},t);
  const inp=(k,ph)=>{ const i=ce("input",{type:"text",class:"inp",placeholder:ph}); i.value=o[k]; i.addEventListener("input",e=>o[k]=e.target.value); return i; };
  const selc=(k,opts)=>ce("select",{class:"inp",onchange:e=>{o[k]=e.target.value;o.estado="";o.arq=null;render();}},...opts.map(([v,l])=>ce("option",{value:v,...(o[k]===v?{selected:"selected"}:{})},l)));
  const tamsAll=[...new Set(todos.flatMap(tamsDe))].sort((a,b)=>+a-+b);
  const sm=(bg,c)=>({padding:"8px 14px",fontSize:"12px",background:bg,color:c});
  const gerar=async()=>{
    const lista=pdfProdutos(escolhidos,todos,o);
    if(!lista.length) return toast("Nenhum produto com esses filtros.");
    o.estado="gerando"; o.prog="Preparando..."; o.arq=null; render();
    try{
      const r=await geraCatalogoPDF(lista,o,(a,b)=>{ o.prog=`Carregando fotos ${a}/${b}`; const el=document.getElementById("pdf-prog"); if(el) el.textContent=o.prog; });
      o.arq=r; o.estado="pronto"; toast("📄 Catálogo pronto!");
    }catch(e){ o.estado=""; toast("⚠️ Não foi possível gerar o PDF. Verifique a internet.",4500); }
    render();
  };
  const baixar=()=>{ const a=ce("a",{href:URL.createObjectURL(o.arq.blob),download:o.arq.nome}); document.body.appendChild(a); a.click(); a.remove(); };
  const compartilhar=async()=>{
    const f=new File([o.arq.blob],o.arq.nome,{type:"application/pdf"});
    const txt=`${o.cliente?`Olá, ${o.cliente.split(" ")[0]}! `:""}Segue o catálogo atualizado da Glamour Shoes de hoje (${new Date().toLocaleDateString("pt-BR")}). É só tocar no produto para abrir no site. 💖`;
    if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],text:txt}); }catch(e){} }
    else { baixar(); toast("PDF baixado. Anexe no WhatsApp Web.",4500); }
  };
  return ce("div",{class:"card",style:{borderLeft:`4px solid ${PINK}`}},
    ce("div",{style:{fontWeight:700,fontSize:"15px",marginBottom:"4px"}},"📄 Catálogo em PDF"),
    ce("p",{style:{fontSize:"12px",color:"#888",marginBottom:"12px"}},"Para clientes que não navegam no site: um PDF com foto, preço, numeração e descrição. Cada produto tem link para abrir direto no catálogo."),
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:"10px"}},
      ce("div",{},lbl("Título"),inp("titulo","Catálogo de calçados")),
      ce("div",{},lbl("Nome da cliente (opcional)"),inp("cliente","Ex: Maria")),
      ce("div",{},lbl("Preço"),selc("preco",[["atacado","Atacado (revendedoras)"],["varejo","Varejo (cliente final)"],["ambos","Atacado e varejo"],["sem","Sem preço"]])),
      ce("div",{},lbl("Produtos"),selc("origem",[["todos","Todos com estoque"],...(escolhidos.length?[["sel",`Só os ${escolhidos.length} selecionados`]]:[])])),
      ce("div",{},lbl("Gênero"),selc("genero",[["","Todos"],["Feminino","Feminino"],["Masculino","Masculino"],["Infantil","Infantil"]])),
      ce("div",{},lbl("Numeração da cliente"),selc("tam",[["","Todas"],...tamsAll.map(t=>[t,`Só nº ${t}`])]))),
    ce("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center",marginTop:"12px"}},
      ce("button",{class:"btn",disabled:o.estado==="gerando"||!qtd,style:sm(PINK,"#fff"),onclick:gerar},o.estado==="gerando"?"Gerando...":`Gerar PDF (${qtd} produto${qtd!==1?"s":""})`),
      o.estado==="gerando"?ce("span",{id:"pdf-prog",style:{fontSize:"12px",color:"#888"}},o.prog):null,
      o.estado==="pronto"&&o.arq?ce("button",{class:"btn",style:sm("#e8f5e9","#2e7d32"),onclick:compartilhar},"📤 Enviar no WhatsApp"):null,
      o.estado==="pronto"&&o.arq?ce("button",{class:"btn",style:sm("#e3f2fd","#1565c0"),onclick:baixar},"⬇ Baixar PDF"):null,
      o.estado==="pronto"&&o.arq?ce("button",{class:"btn",style:sm("#f0f0f0","#1a1a2e"),onclick:()=>window.open(URL.createObjectURL(o.arq.blob),"_blank")},"Ver"):null,
      o.estado==="pronto"&&o.arq?ce("span",{style:{fontSize:"11px",color:"#888"}},`${o.arq.nome} • ${o.arq.blob.size<1048576?Math.round(o.arq.blob.size/1024)+" KB":(o.arq.blob.size/1048576).toFixed(1).replace(".",",")+" MB"}`):null));
}

function carregaQR(){
  if(window.QRCode) return Promise.resolve();
  if(window._qrP) return window._qrP;
  return window._qrP=new Promise((ok,no)=>{ const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; sc.onload=ok; sc.onerror=no; document.head.appendChild(sc); });
}
function textoProduto(p,link){
  const tams=Object.keys(p.stock).filter(k=>(+p.stock[k]||0)>0).sort((a,b)=>+a-+b);
  return `👟 ${p.name}\n💰 ${fmt(p.varejo)}${tams.length?`\n📏 Numeração: ${tams.join(", ")}`:""}\n🛒 Compre aqui: ${link}`;
}
async function compartilhaProduto(p,link){
  const text=textoProduto(p,link);
  if(navigator.share){
    try{
      let files;
      try{ const b=await (await fetch(p.image,{mode:"cors"})).blob(); const f=new File([b],`${p.code||p.id}.jpg`,{type:b.type||"image/jpeg"});
        if(navigator.canShare&&navigator.canShare({files:[f]})) files=[f]; }catch(e){}
      await navigator.share(files?{files,text}:{text}); return;
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
}

  );
}

// ═══════════════════════════════════════════════════════════════════════════
// INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════════════
captureRef();
if(PAINEL_AFI){ loadAfiPanel(); window.addEventListener("hashchange",loadAfiPanel); }
if(CADASTRO_AFI) loadInfoCadastro();
if(!S.token) logoutLocal("");   // visitante não guarda pedidos nem clientes no aparelho
render();

if(!PAINEL_AFI&&!CADASTRO_AFI){ checkPaymentReturn(); if(S.scriptUrl) loadFromSheets(false); }

// Aviso quando o site foi atualizado e este aparelho está com a versão antiga
let _verAtual=null;
async function checkNewVersion(){
  try{
    const t=await (await fetch("/",{cache:"no-store"})).text();
    const m=t.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if(m&&m[1]!==APP_VERSION&&!document.getElementById("upd-bar")){
      const bar=ce("div",{id:"upd-bar",style:{position:"fixed",left:"0",right:"0",bottom:"0",zIndex:"9000",background:"#1a1a2e",color:"#fff",
        padding:"12px 16px",display:"flex",gap:"10px",alignItems:"center",justifyContent:"center",flexWrap:"wrap",fontSize:"14px"}},
        "Há uma versão nova do site.",
        ce("button",{class:"btn",style:{background:PINK,color:"#fff",padding:"7px 16px"},onclick:()=>location.reload()},"Atualizar agora"));
      document.body.appendChild(bar);
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkNewVersion(); });
setInterval(checkNewVersion,600000);

// Sync automático a cada 30 minutos (silencioso)
setInterval(()=>{ if(S.scriptUrl&&!S.syncing) loadFromSheets(false); }, 1800000);

</script>
