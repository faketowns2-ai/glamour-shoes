// normaliza data para YYYY-MM-DD
function normDate(o){
  if(o.date){
    const _d=new Date(o.date);
    if(/^\d{4}-\d{2}-\d{2}$/.test(o.date)) return o.date;
    if(!isNaN(_d)) return _d.toISOString().slice(0,10);
  }
  if(o.dateStr){
    const m=o.dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  }
  return "";
}

// ─── ce: cria elemento DOM ───────────────────────────────────────────────────
function ce(tag,props,...kids){
  const el=document.createElement(tag);
  if(props) Object.entries(props).forEach(([k,v])=>{
    if(v==null||v===false) return;
    if(k==="class") el.className=v;
    else if(k==="style"&&typeof v==="object") Object.assign(el.style,v);
    else if(k==="checked"){ el.checked=!!v; }
    else if(k==="disabled"){ if(v) el.disabled=true; }
    else if(k.startsWith("on")&&typeof v==="function") el.addEventListener(k.slice(2).toLowerCase(),v);
    else el.setAttribute(k,v);
  });
  kids.flat(9).forEach(k=>{
    if(k==null||k===false||k===undefined) return;
    el.appendChild(typeof k==="string"||typeof k==="number"
      ? document.createTextNode(String(k)) : k);
  });
  return el;
}

// ─── OCULTAR PRODUTOS ────────────────────────────────────────────────────────
// A planilha tem colunas fixas, então o status "oculto" é gravado dentro do
// JSON da coluna stock (chave "_oculto"). Ao carregar, ele vira p.hidden.
// O preço de varejo vem da coluna "varejo" da planilha e também é guardado como
// "_varejo" no JSON de estoque (funciona mesmo antes da coluna existir).
function normProd(p){
  if(!p||!p.stock) return p;
  const st={...p.stock};
  if("_oculto" in st){ p.hidden=!!st._oculto; delete st._oculto; }
  if("_varejo" in st){ const v=+st._varejo||0; delete st._varejo; if(!(+p.varejo>0)) p.varejo=v; }
  p.stock=st;
  return p;
}
function normProds(arr){ return (arr||[]).map(normProd); }
function prodsForSheet(){
  return S.products.map(p=>{
    const {hidden,...rest}=p;
    const st={...(p.stock||{})};
    if(hidden) st._oculto=1;
    if(+p.varejo>0) st._varejo=+p.varejo;
    return {...rest,stock:st};
  });
}
function totalStock(p){ return Object.values(p.stock||{}).reduce((a,b)=>a+(+b||0),0); }

// force=true → sobrescreve tudo (sync manual)
// force=false → só acrescenta novos, preserva locais
async function loadFromSheets(force=false){
  if(!S.scriptUrl) return false;
  if(force && window._stockDraft){
    const ok=confirm("Há alterações de estoque não salvas. Sincronizar vai descartá-las. Continuar?");
    if(!ok) return false;
    window._stockDraft=null;
  }
  if(force){ S.syncing=true; render(); }
  try{
    const res=await fetch(S.scriptUrl,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"load",token:S.token||undefined})});
    const data=await res.json();
    if(data.ok&&S.token&&!data.admin) logoutLocal("Sessão expirada. Entre de novo no Admin.");
    if(data.ok){
      if(data.afiliados){ S.afiliados=data.afiliados; lsSet("gs_afi",S.afiliados); }
      if(force){
        if(data.products&&data.products.length>0){ S.products=normProds(data.products); lsSet("gs_prod",S.products); }
        if(data.orders  &&data.orders.length>0)  { S.orders=data.orders;     lsSet("gs_ord",S.orders);   }
        if(data.crm     &&data.crm.length>0)     { S.crm=data.crm;           lsSet("gs_crm",S.crm);      }
        toast("✅ Dados recarregados da planilha!");
      } else {
        // sync silencioso: só acrescenta
        if(data.orders&&data.orders.length>0){
          const ids=new Set(S.orders.map(o=>String(o.id)));
          const novos=data.orders.filter(o=>!ids.has(String(o.id)));
          if(novos.length){ S.orders=[...novos,...S.orders]; lsSet("gs_ord",S.orders); }
          S.orders.forEach(o=>{
            const r=data.orders.find(x=>String(x.id)===String(o.id));
            if(r&&r.pago&&!o.pago) Object.assign(o,r);
            else if(r&&r.status!==o.status) o.status=r.status;
          });
          lsSet("gs_ord",S.orders);
        }
        if(data.crm&&data.crm.length>0){
          data.crm.forEach(rc=>{
            const lc=S.crm.find(c=>c.phone===rc.phone);
            if(!lc) S.crm.push(rc);
            else if(rc.orders>lc.orders) Object.assign(lc,rc);
          });
          lsSet("gs_crm",S.crm);
        }
        if(!window._stockDraft&&data.products&&data.products.length>0){
          S.products=normProds(data.products); lsSet("gs_prod",S.products);
        }
      }
      S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); S.syncError="";
    } else {
      S.syncError=data.error||"Erro ao carregar";
      if(force) toast("⚠️ "+S.syncError,4000);
    }
  }catch(e){
    S.syncError="Sem conexão";
    if(force) toast("⚠️ Modo offline – usando dados locais",4000);
  }
  if(force){ S.syncing=false; }
  render(); return true;
}

async function _call(body){
  if(!S.scriptUrl) return {ok:false,error:"Sem conexão com a planilha."};
  try{
    const res=await fetch(S.scriptUrl,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({...body,token:S.token||undefined})});
    const d=JSON.parse(await res.text());
    if(d.auth===false) logoutLocal("Sessão expirada. Entre de novo no Admin.");
    return d;
  }catch(e){ return {ok:false,error:"Sem conexão. Tente de novo."}; }
}
async function _post(body){
  const d=await _call(body);
  if(d.ok){ S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); return true; }
  return false;
}
function logoutLocal(msg){
  S.token=""; S.unlocked=false; lsSet("gs_token","");
  S.orders=[]; S.crm=[]; S.afiliados=[];
  ["gs_ord","gs_crm","gs_afi"].forEach(k=>{ try{localStorage.removeItem(k);}catch(e){} });
  if(msg){ toast(msg,4000); if(String(S.view).startsWith("admin")) S.view="adminLogin"; render(); }
}

async function persistProducts(force=false){
  lsSet("gs_prod",S.products);
  const d=await _call({action:"saveProducts",products:prodsForSheet()});
  const ok=!!d.ok;
  if(ok){ S.lastSync=nowStr(); lsSet("gs_lastsync",S.lastSync); S.lastError=""; }
  else S.lastError=d.auth===false?"sessão expirada, entre de novo no Admin":(d.error||"erro na planilha");
  if(force&&!ok) toast(`⚠️ Erro na planilha: ${S.lastError}`,5000);
  render(); return ok;
}
async function persistOrders(force=false){
  lsSet("gs_ord",S.orders);

}

}
async function syncAll(msg){
  if(!S.scriptUrl){ toast(msg||"Salvo localmente."); return; }
  S.syncing=true; render();
  const ok=await _post({action:"saveAll",products:prodsForSheet(),orders:S.orders,crm:S.crm});
  S.syncError=ok?"":"Erro ao sincronizar";
  toast(ok?(msg||"✅ Sincronizado!"):"⚠️ Salvo localmente. Erro na planilha.",ok?3000:4000);
  S.syncing=false; render();
}

// ─── BLACK FRIDAY ───────────────────────────────────────────────────────────
function bfParts(){
  let ms=Math.max(0,new Date(BF.fim).getTime()-Date.now());
  const d=Math.floor(ms/864e5); ms-=d*864e5;
  const h=Math.floor(ms/36e5);  ms-=h*36e5;
  const m=Math.floor(ms/6e4);   ms-=m*6e4;
  const s=Math.floor(ms/1e3);
  return {d,h,m,s};
}
function buildBFBar(){
  const t=bfParts(), two=n=>String(n).padStart(2,"0");
  const box=(id,val,lbl)=>ce("div",{class:"bf-box"},ce("b",{id},val),ce("span",{},lbl));
  return ce("div",{class:"bf-bar"},
    ce("div",{class:"bf-inner"},
      ce("div",{class:"bf-title"},
        ce("div",{class:"bf-kicker"},"Glamour❤️Shoes apresenta"),
        ce("div",{class:"bf-word"},"BLACK ",ce("em",{},"FRIDAY"))),
      ce("div",{class:"bf-count"},
        ce("div",{class:"bf-count-lbl"},"Termina em"),
        ce("div",{class:"bf-boxes"},
          box("bf-d",two(t.d),"dias"),box("bf-h",two(t.h),"horas"),
          box("bf-m",two(t.m),"min"),box("bf-s",two(t.s),"seg")))));
}
setInterval(()=>{
  const el=document.getElementById("bf-s");
  if(!el){ return; }
  if(!bfOn()){ render(); return; }
  const t=bfParts(), two=n=>String(n).padStart(2,"0");
  [["bf-d",t.d],["bf-h",t.h],["bf-m",t.m],["bf-s",t.s]].forEach(([id,v])=>{
    const e=document.getElementById(id); if(e&&e.textContent!==two(v)) e.textContent=two(v);
  });
},1000);

  return ce("div",{},banner,filters,

function getFilteredProds(){
  let p=S.products.filter(x=>!x.hidden&&priceOf(x)>0&&Object.keys(x.stock||{}).length>0);
  if(S.fGender) p=p.filter(x=>x.gender===S.fGender);
  if(S.fSize)   p=p.filter(x=>(x.stock[S.fSize]||0)>0);
  if(S.fText)   p=p.filter(x=>x.name.toLowerCase().includes(S.fText.toLowerCase()));
  if(S.fPrice==="0-150")    p=p.filter(x=>priceOf(x)<150);
  if(S.fPrice==="150-250")  p=p.filter(x=>priceOf(x)>=150&&priceOf(x)<250);
  if(S.fPrice==="250+")     p=p.filter(x=>priceOf(x)>=250);
  if(S.fSort==="az")        p.sort((a,b)=>a.name.localeCompare(b.name));
  if(S.fSort==="price_asc") p.sort((a,b)=>priceOf(a)-priceOf(b));
  if(S.fSort==="price_desc")p.sort((a,b)=>priceOf(b)-priceOf(a));
  if(S.fSort==="featured")  p.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  return p;
}

function buildProductCard(p){

  const gColor=p.gender==="Masculino"?"#1565c0":p.gender==="Infantil"?"#6a1b9a":PINK;
  const gBg   =p.gender==="Masculino"?"#e3f2fd":p.gender==="Infantil"?"#f3e5f5":"#fce4ec";
  const gGrad =p.gender==="Masculino"?"linear-gradient(90deg,#90caf9,#1565c0)":
                p.gender==="Infantil"?"linear-gradient(90deg,#ce93d8,#6a1b9a)":
                                       "linear-gradient(90deg,#f48fb1,#e91e8c)";
  const img=ce("img",{src:p.image,alt:p.name,style:{width:"100%",height:"100%",objectFit:"cover"}});
  img.addEventListener("error",()=>img.style.display="none");
  const hasStock=allSizes.some(s=>(p.stock[s]||0)>0);

  return ce("div",{class:"product-card"},

    ce("div",{style:{width:"100%",aspectRatio:"1/1",background:"#eee",overflow:"hidden"}},
      p.image?img:ce("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontSize:"44px"}},"👠")),
    ce("div",{style:{padding:"13px 15px"}},
      ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},
        p.code?ce("div",{style:{fontSize:"11px",color:"#aaa"}},`Cód: ${p.code}`):ce("span"),
        ce("span",{class:"badge",style:{background:gBg,color:gColor}},p.gender)
      ),
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"3px"}},p.name),
      ce("div",{style:{fontSize:"12px",color:"#777",marginBottom:"8px"}},p.desc),
      ce("div",{style:{fontWeight:800,color:PINK,fontSize:"17px",marginBottom:"10px"}},fmt(priceOf(p))),
      ce("div",{style:{fontSize:"12px",fontWeight:600,color:"#555",marginBottom:"5px"}},"Numeração:"),
      ce("div",{style:{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"10px"}},
        ...allSizes.map(s=>{
          const zero=(p.stock[s]||0)<=0;
          const on=sel.size===s&&!zero;
          return ce("button",{
            class:"sz-btn"+(on?" on":"")+(zero?" out":""),
            disabled:zero,
            onclick:()=>{ if(!zero){S.sel[p.id]={...sel,size:s};render();} }
          },s);
        })
      ),
      sel.size?ce("div",{style:{fontSize:"11px",color:"#888",marginBottom:"8px"}},`Estoque: ${p.stock[sel.size]||0} un.`):null,
      ce("div",{style:{display:"flex",alignItems:"center",gap:"7px",marginBottom:"10px"}},
        ce("span",{style:{fontSize:"13px",fontWeight:600,color:"#555"}},"Qtd:"),
        ce("button",{class:"qty-btn",onclick:()=>{S.sel[p.id]={...sel,qty:Math.max(1,(sel.qty||1)-1)};render();}},"−"),
        ce("span",{style:{fontWeight:700,minWidth:"18px",textAlign:"center"}},sel.qty||1),

      ),

function addToCart(p,size,qty){
  if(!size) return toast("Selecione um número!");
  const av=p.stock[size]||0;
  if(av<1) return toast("Sem estoque nesse número!");
  const key=`${p.id}-${size}`;
  const ex=S.cart.find(i=>i.key===key);
  const nq=(ex?ex.qty:0)+qty;
  if(nq>av) return toast("Quantidade maior que o estoque!");
  if(ex) ex.qty=nq;
  else S.cart.push({key,pid:p.id,name:p.name,code:p.code,image:p.image,size,qty,price:priceOf(p),cost:p.cost});
  S.sel[p.id]={size:"",qty:1};
  toast("Adicionado ao carrinho!"); render();
}

function cartPayload(){
  return {mode:VAREJO?"varejo":"atacado",client:S.cName.trim(),phone:S.cPhone.trim(),ref:getRef(),
          items:S.cart.map(i=>({pid:i.pid,size:i.size,qty:i.qty}))};
}
async function doFinalize(){
  if(!S.cName.trim()) return toast("Informe o nome!");
  if(!S.cPhone.trim()) return toast("Informe o WhatsApp!");
  if(S.busy) return; S.busy=true; render();
  const d=await _call({action:"createOrder",...cartPayload()});
  S.busy=false;
  if(!d.ok&&d.error&&!/conexão/i.test(d.error)){ render(); return toast(d.error,4500); }
  const total=d.ok?d.total:S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const lines=S.cart.map(i=>`• ${i.name} | Nº ${i.size} | Qtd: ${i.qty} | ${fmt(i.price*i.qty)}`).join("\n");
  const ref=getRef();
  const msg=`*Pedido Glamour❤️Shoes${VAREJO?" (VAREJO)":" (ATACADO)"}*${d.ok?` #${d.id}`:""}\n\nCliente: ${S.cName}\nWhatsApp: ${S.cPhone}${ref?`\nIndicação: ${ref}`:""}\n\n${lines}\n\n*Total: ${fmt(total)}*`;
  S.cart=[]; S.cName=""; S.cPhone="";
  toast("Pedido enviado! Aguardando confirmação."); go("catalog");
  location.href=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}

async function doPay(){
  if(!S.cName.trim()) return toast("Informe o nome!");
  if(S.cPhone.replace(/\D/g,"").length<10) return toast("Informe o WhatsApp com DDD!");
  if(S.busy) return; S.busy=true; render();
  const d=await _call({action:"checkout",...cartPayload()});
  if(!d.ok||!d.url){ S.busy=false; render(); return toast(d.error||"Não foi possível gerar o pagamento.",4500); }
  lsSet("gs_lastorder",{id:d.id,total:d.total,client:S.cName,phone:S.cPhone,
    items:S.cart.map(i=>({name:i.name,size:i.size,qty:i.qty,price:i.price}))});
  location.href=d.url;
}

// ─── RETORNO DO PAGAMENTO ────────────────────────────────────────────────────
async function checkPaymentReturn(){
  const q=new URLSearchParams(location.search);
  const nsu=q.get("order_nsu")||q.get("pedido");
  if(!nsu||!q.get("transaction_nsu")) return;
  S.view="paid"; S.payResult={state:"checking",id:nsu}; S.cart=[]; render();
  const args={action:"confirm",order_nsu:nsu,transaction_nsu:q.get("transaction_nsu"),
    slug:q.get("slug")||"",receipt_url:q.get("receipt_url")||"",capture_method:q.get("capture_method")||""};
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  let d={};
  for(let t=0;t<4;t++){
    d=await _call(args);
    if(d.ok&&d.paid) break;
    await new Promise(r=>setTimeout(r,3000));
  }
  S.payResult={state:d.ok&&d.paid?"paid":"pending",id:nsu,order:d.order||lsGet("gs_lastorder",null),receipt:args.receipt_url,args};
  render();
}

  const msg=`*Pedido PAGO Glamour❤️Shoes* #${r.id}\n\n${o?`Cliente: ${o.client}\n\n${lines}\n\n*Total pago: ${fmt(o.total)}*`:""}${r.receipt?`\n\nComprovante: ${r.receipt}`:""}`;
  return ce("div",{class:"card",style:{maxWidth:"480px",margin:"30px auto",textAlign:"center",padding:"30px 22px"}},

    paid?ce("a",{class:"btn",href:`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,

function captureRef(){
  const r=new URLSearchParams(location.search).get("ref");
  if(r){ const c=r.toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,30); if(c) lsSet("gs_ref",{c,exp:Date.now()+30*864e5}); }
}
function getRef(){ const r=lsGet("gs_ref",null); return r&&r.exp>Date.now()?r.c:""; }

function crmUpsert(order){
  const ex=S.crm.find(c=>c.phone===order.phone);
  if(ex){ ex.name=order.client; ex.pending=(ex.pending||0)+1; ex.lastOrder=order.date; }
  else S.crm.push({id:Date.now()+Math.random(),name:order.client,phone:order.phone,
                   orders:0,pending:1,lastOrder:order.date,since:order.date});
}

}

function buildOrderEditor(o){
  if(!S._orderEdits[o.id]) S._orderEdits[o.id]={items:[...o.items.map(i=>({...i}))]};
  const draft=S._orderEdits[o.id];
  const draftTotal=draft.items.reduce((s,i)=>s+i.price*i.qty,0);
  if(!S._addItem[o.id]) S._addItem[o.id]={pid:"",size:"",qty:1};
  const add=S._addItem[o.id];
  const selProd=S.products.find(p=>String(p.id)===String(add.pid));
  const availSizes=selProd?Object.entries(selProd.stock).filter(([,q])=>q>0).map(([s])=>s):[];

  const prodSel=ce("select",{style:{padding:"6px 10px",borderRadius:"8px",border:"1.5px solid #e0d0d8",fontSize:"13px",flex:1}});
  prodSel.appendChild(ce("option",{value:""},"— Selecionar produto —"));
  S.products.forEach(p=>{
    const opt=ce("option",{value:String(p.id)},`${p.name} (${fmt(p.price)})`);
    if(String(p.id)===String(add.pid)) opt.selected=true;
    prodSel.appendChild(opt);
  });
  prodSel.addEventListener("change",e=>{S._addItem[o.id].pid=e.target.value;S._addItem[o.id].size="";render();});

  const sizeSel=ce("select",{style:{padding:"6px 10px",borderRadius:"8px",border:"1.5px solid #e0d0d8",fontSize:"13px"}});
  sizeSel.appendChild(ce("option",{value:""},"Nº"));
  availSizes.forEach(s=>{
    const opt=ce("option",{value:s},s);
    if(s===add.size) opt.selected=true;
    sizeSel.appendChild(opt);
  });
  sizeSel.addEventListener("change",e=>{S._addItem[o.id].size=e.target.value;render();});

  const qtyInp=ce("input",{type:"number",style:{width:"52px",padding:"6px 8px",borderRadius:"8px",border:"1.5px solid #e0d0d8",fontSize:"13px",textAlign:"center"}});
  qtyInp.value=add.qty; qtyInp.min="1";
  qtyInp.addEventListener("input",e=>S._addItem[o.id].qty=Math.max(1,+e.target.value));

  return ce("div",{style:{marginTop:"6px"}},
    ce("div",{style:{marginBottom:"10px"}},
      ...draft.items.map((item,idx)=>
        ce("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px",
          background:"#f7f0f5",borderRadius:"8px",padding:"6px 10px"}},
          ce("span",{style:{flex:1,fontSize:"13px"}},`${item.name} | Nº ${item.size}`),
          ce("span",{style:{fontSize:"12px",color:PINK,fontWeight:700,minWidth:"60px",textAlign:"right"}},fmt(item.price*item.qty)),
          ce("button",{style:{background:"none",border:"none",color:"#e53935",fontSize:"16px",cursor:"pointer",fontWeight:700},
            onclick:()=>{draft.items.splice(idx,1);render();}},"✕")
        )
      )
    ),
    ce("div",{style:{background:"#f0f8ff",borderRadius:"10px",padding:"10px",marginBottom:"10px"}},
      ce("div",{style:{fontSize:"12px",fontWeight:600,color:"#555",marginBottom:"7px"}},"Adicionar produto ao pedido:"),
      ce("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}},
        prodSel,sizeSel,qtyInp,
        ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:PINK,color:"#fff"},
          onclick:()=>{
            if(!add.pid) return toast("Selecione um produto!");
            if(!add.size) return toast("Selecione um número!");
            const p=S.products.find(x=>String(x.id)===String(add.pid)); if(!p) return;
            const key=`${p.id}-${add.size}`;
            const ex=draft.items.find(i=>`${i.pid}-${i.size}`===key||i.key===key);
            if(ex) ex.qty+=add.qty;
            else draft.items.push({key,pid:p.id,name:p.name,code:p.code,image:p.image,
              size:add.size,qty:add.qty,price:p.price,cost:p.cost});
            S._addItem[o.id]={pid:"",size:"",qty:1}; render();
          }},"+ Adicionar")
      )
    ),
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}},
      ce("div",{style:{fontWeight:800,color:PINK,fontSize:"15px"}},`Total: ${fmt(draftTotal)}`),
      ce("div",{style:{display:"flex",gap:"6px"}},
        ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:"#eee",color:"#1a1a2e"},
          onclick:()=>{S._editingOrder=null;delete S._orderEdits[o.id];delete S._addItem[o.id];render();}},"Cancelar"),
        ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:"#4caf50",color:"#fff"},
          onclick:()=>{
            if(!draft.items.length) return toast("O pedido não pode ficar vazio!");
            o.items=[...draft.items]; o.total=draftTotal;
            S._editingOrder=null; delete S._orderEdits[o.id]; delete S._addItem[o.id];
            persistOrders(); toast("✅ Pedido atualizado!"); render();
          }},"💾 Salvar")
      )
    )
  );
}

function mkBadge(status){
  const M={confirmed:["Confirmado","#e8f5e9","#2e7d32"],cancelled:["Cancelado","#ffebee","#c62828"],pending:["Aguardando","#fff3e0","#e65100"]};
  const[label,bg,color]=M[status]||M.pending;
  return ce("span",{class:"badge",style:{background:bg,color}},label);
}

async function confirmOrder(id){
  const o=S.orders.find(x=>x.id===id);
  if(!o||o.status!=="pending") return;
  o.items.forEach(item=>{
    const p=S.products.find(x=>x.id===item.pid||x.id===item.productId);
    if(p&&p.stock[item.size]!==undefined) p.stock[item.size]=Math.max(0,(p.stock[item.size]||0)-item.qty);
  });
  o.status="confirmed";
  if(o.ref&&!o.comissao){ const a=S.afiliados.find(x=>x.codigo===o.ref); if(a) o.comissao=Math.round(o.total*(+a.comissao||0))/100; }
  const c=S.crm.find(x=>x.phone===o.phone);
  if(c){c.orders=(c.orders||0)+1;c.pending=Math.max(0,(c.pending||1)-1);c.lastOrder=o.date;}
  lsSet("gs_prod",S.products); lsSet("gs_ord",S.orders); lsSet("gs_crm",S.crm);
  render();
  S.syncing=true; render();
  const ok=await _post({action:"saveAll",products:prodsForSheet(),orders:S.orders,crm:S.crm});
  S.syncing=false;
  toast(ok?"✅ Pedido confirmado! Estoque atualizado na planilha.":"✅ Confirmado localmente. ⚠️ Erro na planilha.",ok?3000:5000);
  render();
}

// ─── MANUAL ──────────────────────────────────────────────────────────────────
function buildManual(){
  if(!S._manualAC) S._manualAC={show:false,query:""};
  const filtCRM=S._manualAC.query.length>0
    ?S.crm.filter(c=>c.name.toLowerCase().includes(S._manualAC.query.toLowerCase())||c.phone.includes(S._manualAC.query))
    :[];

  const nameWrap=ce("div",{style:{position:"relative"}});
  const nameInp=ce("input",{type:"text",class:"inp",placeholder:"Busque cliente ou digite o nome..."});
  nameInp.value=S.manualName;
  nameInp.addEventListener("input",e=>{S.manualName=e.target.value;S._manualAC.query=e.target.value;S._manualAC.show=true;render();});
  nameInp.addEventListener("focus",e=>{S._manualAC.query=e.target.value;S._manualAC.show=true;render();});
  nameInp.addEventListener("blur",()=>setTimeout(()=>{S._manualAC.show=false;render();},200));
  nameWrap.appendChild(nameInp);

  if(S._manualAC.show&&filtCRM.length>0){
    const drop=ce("div",{class:"ac-drop"});
    filtCRM.slice(0,6).forEach(c=>{
      const row=ce("div",{class:"ac-row"},
        ce("div",{},ce("div",{style:{fontWeight:600}},c.name),ce("div",{style:{fontSize:"11px",color:"#aaa"}},c.phone)),
        ce("span",{style:{fontSize:"11px",color:PINK,fontWeight:600}},`${c.orders} pedido${c.orders!==1?"s":""}`)
      );
      row.addEventListener("mousedown",()=>{S.manualName=c.name;S.manualPhone=c.phone;S._manualAC.show=false;S._manualAC.query="";render();});
      drop.appendChild(row);
    });
    nameWrap.appendChild(drop);
  }

  const phoneInp=ce("input",{type:"text",class:"inp",placeholder:"Ex: 96 99999-9999"});
  phoneInp.value=S.manualPhone; phoneInp.addEventListener("input",e=>S.manualPhone=e.target.value);
  const manTotal=S.manualCart.reduce((s,i)=>s+i.price*i.qty,0);

  const prodCards=S.products.map(p=>{
    const sz=S.manualSz[p.id]||""; const qty=S.manualQty[p.id]||1;
    const allSizes=Object.keys(p.stock).sort((a,b)=>+a-+b);
    return ce("div",{style:{background:"#fff",borderRadius:"14px",padding:"13px 14px",boxShadow:"0 2px 8px rgba(0,0,0,.07)"}},
      ce("div",{style:{display:"flex",gap:"10px",alignItems:"center",marginBottom:"10px"}},
        ce("div",{style:{width:"46px",height:"46px",borderRadius:"9px",overflow:"hidden",background:"#eee",flexShrink:0}},
          p.image?ce("img",{src:p.image,alt:"",style:{width:"100%",height:"100%",objectFit:"cover"}}):ce("span",{style:{fontSize:"22px"}},"👠")),
        ce("div",{},
          p.code?ce("div",{style:{fontSize:"10px",color:"#aaa"}},p.code):null,
          ce("div",{style:{fontWeight:700,fontSize:"13px"}},p.name),
          ce("div",{style:{fontWeight:800,color:PINK,fontSize:"13px"}},fmt(p.price)))
      ),
      ce("div",{style:{display:"flex",flexWrap:"wrap",gap:"5px",marginBottom:"8px"}},
        ...allSizes.map(s=>{
          const zero=(p.stock[s]||0)<=0;
          return ce("button",{class:"sz-btn"+(sz===s&&!zero?" on":"")+(zero?" out":""),
            disabled:zero,onclick:()=>{if(!zero){S.manualSz[p.id]=s;render();}}},s);
        })
      ),
      sz?ce("div",{style:{fontSize:"11px",color:"#888",marginBottom:"6px"}},`Disponível: ${p.stock[sz]||0} un.`):null,
      ce("div",{style:{display:"flex",alignItems:"center",gap:"7px",marginBottom:"8px"}},
        ce("span",{style:{fontSize:"12px",fontWeight:600,color:"#555"}},"Qtd:"),
        ce("button",{class:"qty-btn qty-sm",onclick:()=>{S.manualQty[p.id]=Math.max(1,(S.manualQty[p.id]||1)-1);render();}},"−"),
        ce("span",{style:{fontWeight:700,minWidth:"18px",textAlign:"center"}},qty),
        ce("button",{class:"qty-btn qty-sm",onclick:()=>{S.manualQty[p.id]=(S.manualQty[p.id]||1)+1;render();}},"+")
      ),
      ce("button",{class:"btn",disabled:!allSizes.some(s=>(p.stock[s]||0)>0),
        style:{width:"100%",padding:"8px 0",borderRadius:"24px",fontSize:"12px",
          background:allSizes.some(s=>(p.stock[s]||0)>0)?PINK:"#ccc",color:"#fff"},
        onclick:()=>{
          if(!sz) return toast("Selecione um número!");
          const av=p.stock[sz]||0; if(!av) return toast("Sem estoque!");
          const key=`${p.id}-${sz}`;
          const ex=S.manualCart.find(i=>i.key===key);
          const nq=(ex?ex.qty:0)+qty;
          if(nq>av) return toast("Quantidade maior que o estoque!");
          if(ex) ex.qty=nq;
          else S.manualCart.push({key,pid:p.id,name:p.name,code:p.code,image:p.image,size:sz,qty,price:p.price,cost:p.cost});
          S.manualSz[p.id]=""; S.manualQty[p.id]=1; toast("Adicionado!"); render();
        }},"Adicionar")
    );
  });

  const cartSection=S.manualCart.length>0?ce("div",{class:"card"},
    ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"12px"}},"Itens do pedido:"),
    ...S.manualCart.map(item=>ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px",fontSize:"13px"}},
      ce("span",{},`${item.name} | Nº ${item.size} x${item.qty}`),
      ce("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
        ce("span",{style:{fontWeight:700,color:PINK}},fmt(item.price*item.qty)),
        ce("button",{style:{background:"none",border:"none",color:"#ccc",fontSize:"15px"},
          onclick:()=>{S.manualCart=S.manualCart.filter(i=>i.key!==item.key);render();}},"✕")))),
    ce("div",{style:{borderTop:"1px solid #eee",marginTop:"10px",paddingTop:"10px",
      display:"flex",justifyContent:"space-between",fontWeight:800,fontSize:"16px",color:PINK}},
      ce("span",{},"Total"),ce("span",{},fmt(manTotal))),
    ce("button",{class:"btn",style:{width:"100%",marginTop:"14px",padding:"12px 0",borderRadius:"30px",background:PINK,color:"#fff",fontSize:"14px"},
      onclick:()=>{
        if(!S.manualCart.length) return toast("Carrinho vazio!");
        if(!S.manualName.trim()) return toast("Informe o nome!");
        const order={id:Date.now(),date:toDay(),dateStr:nowStr(),client:S.manualName,
                     phone:S.manualPhone||"Loja física",items:S.manualCart.map(i=>({...i})),
                     total:manTotal,status:"pending",origin:"manual"};
        S.orders.unshift(order); crmUpsert(order);
        persistOrders(); persistCRM();
        S.manualCart=[]; S.manualName=""; S.manualPhone=""; S.manualSz={}; S.manualQty={};
        S.adminTab="orders"; toast("Pedido registrado!"); render();
      }},"✅ Registrar Pedido")):null;

  return ce("div",{},
    ce("h3",{style:{marginBottom:"16px",fontSize:"17px"}},"🧾 Pedido Manual (Loja Física)"),
    ce("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"18px"}},
      ce("div",{},
        ce("label",{style:{fontWeight:600,fontSize:"13px",display:"block",marginBottom:"5px"}},
          "Nome do cliente ",ce("span",{style:{fontSize:"11px",color:PINK,fontWeight:400}},"(busque ou digite)")),
        nameWrap),
      ce("div",{},
        ce("label",{style:{fontWeight:600,fontSize:"13px",display:"block",marginBottom:"5px"}},"WhatsApp (opcional)"),
        phoneInp)),
    ce("h4",{style:{marginBottom:"12px",fontSize:"14px",color:"#555"}},"Selecione os produtos:"),
    ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:"14px",marginBottom:"22px"}},...prodCards),
    cartSection
  );
}

function openMsgModal(client,tpl){
  let txt=tpl.text.replace("{nome}",client.name).replace("{link}",CATALOG_URL);
  const ta=ce("textarea",{style:{width:"100%",padding:"10px 13px",borderRadius:"10px",
    border:"1.5px solid #e0d0d8",fontSize:"13px",outline:"none",resize:"vertical",
    lineHeight:"1.6",boxSizing:"border-box",marginBottom:"6px"}});
  ta.value=txt; ta.rows=8;

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
function buildDash(){
  const fOrd=S.orders.filter(o=>{
    if(o.status==="cancelled") return false;
    let oDate=normDate(o);
    if(S.dFrom&&oDate<S.dFrom) return false;
    if(S.dTo  &&oDate>S.dTo)   return false;
    return true;
  });
  const conf=fOrd.filter(o=>o.status==="confirmed");
  const pend=S.orders.filter(o=>o.status==="pending");
  const rev=conf.reduce((s,o)=>s+o.total,0);
  const cst=conf.reduce((s,o)=>s+o.items.reduce((ss,i)=>ss+(i.cost||0)*i.qty,0),0);
  const prf=rev-cst;
  const mrg=rev>0?(prf/rev*100).toFixed(1):0;
  const avg=conf.length>0?rev/conf.length:0;

  const byProd={};
  conf.forEach(o=>o.items.forEach(i=>{
    if(!byProd[i.name]) byProd[i.name]={name:i.name,qty:0,rev:0,prf:0};
    byProd[i.name].qty+=i.qty; byProd[i.name].rev+=i.price*i.qty;
    byProd[i.name].prf+=(i.price-(i.cost||0))*i.qty;
  }));
  const bp=Object.values(byProd).sort((a,b)=>b.rev-a.rev);

  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
    const value=conf.filter(o=>normDate(o)===key).reduce((s,o)=>s+o.total,0);
    days.push({label,value});
  }
  const maxV=Math.max(...days.map(d=>d.value),1);

  const dFromInp=ce("input",{type:"date",class:"inp",style:{width:"auto",padding:"5px 10px"}});
  dFromInp.value=S.dFrom; dFromInp.addEventListener("change",e=>{S.dFrom=e.target.value;render();});
  const dToInp=ce("input",{type:"date",class:"inp",style:{width:"auto",padding:"5px 10px"}});
  dToInp.value=S.dTo; dToInp.addEventListener("change",e=>{S.dTo=e.target.value;render();});
  const qr=`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(CATALOG_URL)}`;

  return ce("div",{},
    ce("h3",{style:{marginBottom:"14px",fontSize:"17px"}},"📊 Dashboard"),
    ce("div",{class:"card",style:{display:"flex",gap:"12px",flexWrap:"wrap",alignItems:"center",marginBottom:"14px"}},
      ce("span",{style:{fontWeight:600,fontSize:"13px"}},"Período:"),
      ce("label",{style:{fontSize:"13px",fontWeight:600,display:"flex",alignItems:"center",gap:"6px"}},"De:",dFromInp),
      ce("label",{style:{fontSize:"13px",fontWeight:600,display:"flex",alignItems:"center",gap:"6px"}},"Até:",dToInp),
      ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:"#eee",color:"#1a1a2e"},
        onclick:()=>{S.dFrom="";S.dTo="";render();}},"Limpar")),
    ce("div",{class:"kpi-grid",style:{marginBottom:"18px"}},
      mkKPI("💰","Faturamento",fmt(rev),"#e3f2fd","#1565c0"),
      mkKPI("🏷","Custo Total",fmt(cst),"#fce4ec","#c62828"),
      mkKPI("📈","Lucro",fmt(prf),"#e8f5e9","#2e7d32"),
      mkKPI("📊","Margem",`${mrg}%`,"#f3e5f5","#6a1b9a"),
      mkKPI("🎯","Ticket Médio",fmt(avg),"#e8f5e9","#1b5e20"),
      mkKPI("✅","Confirmados",conf.length,"#fff8e1","#f57f17"),
      mkKPI("⏳","Pendentes",pend.length,"#fff3e0","#e65100"),
      mkKPI("👥","Clientes",S.crm.length,"#e8eaf6","#283593")
    ),
    ce("div",{class:"card",style:{marginBottom:"18px"}},
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"14px"}},"Faturamento — últimos 7 dias"),
      ce("div",{class:"bar-chart"},
        ...days.map(d=>ce("div",{class:"bar-col"},
          ce("div",{style:{fontSize:"10px",fontWeight:700,color:PINK,minHeight:"14px",textAlign:"center"}},
            d.value>0?fmt(d.value).replace("R$","").trim():""),
          ce("div",{style:{width:"100%",background:PINK,borderRadius:"6px 6px 0 0",
            height:`${(d.value/maxV)*90}px`,minHeight:d.value>0?"4px":"0"}}),
          ce("div",{style:{fontSize:"10px",color:"#888",textAlign:"center",lineHeight:"1.2"}},d.label))))),
    ce("div",{class:"card",style:{marginBottom:"18px"}},
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"12px"}},"Desempenho por Produto"),
      bp.length===0?ce("div",{style:{color:"#aaa",fontSize:"13px"}},"Nenhuma venda confirmada no período."):
      ce("div",{},...bp.map(p=>{
        const pct=rev>0?(p.rev/rev*100).toFixed(0):0;
        return ce("div",{style:{marginBottom:"14px"}},
          ce("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"13px",marginBottom:"4px",flexWrap:"wrap",gap:"4px"}},
            ce("span",{style:{fontWeight:600}},p.name),
            ce("span",{style:{color:"#888",fontSize:"12px"}},
              `${p.qty} un. | ${fmt(p.rev)} | Lucro: `,ce("span",{style:{color:"#2e7d32",fontWeight:700}},fmt(p.prf)))),
          ce("div",{style:{height:"8px",background:"#f0e0ea",borderRadius:"10px",overflow:"hidden"}},
            ce("div",{style:{height:"100%",width:`${pct}%`,background:PINK,borderRadius:"10px"}})));
      }))),
    ce("div",{class:"card",style:{textAlign:"center"}},
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"10px"}},"QR Code do Catálogo"),
      ce("img",{src:qr,alt:"QR",style:{width:"150px",height:"150px",borderRadius:"10px"}}),
      ce("div",{style:{fontSize:"12px",color:"#888",marginTop:"8px",wordBreak:"break-all"}},CATALOG_URL),
      ce("button",{class:"btn",style:{marginTop:"10px",padding:"7px 18px",fontSize:"12px",borderRadius:"20px",background:PINK,color:"#fff"},
        onclick:()=>window.open(qr,"_blank")},"Baixar QR Code"))
  );
}

function mkKPI(icon,label,value,bg,color){
  return ce("div",{style:{background:bg,borderRadius:"14px",padding:"14px 16px",boxShadow:"0 2px 8px rgba(0,0,0,.06)"}},

// ─── STOCK ────────────────────────────────────────────────────────────────────
function buildStock(){
  if(!window._stockDraft) window._stockDraft=S.products.map(p=>({id:p.id,stock:{...p.stock}}));
  function getDraft(pid){ return window._stockDraft.find(d=>d.id===pid); }

  let hasChanges=false;
  S.products.forEach(p=>{
    const draft=getDraft(p.id); if(!draft) return;
    Object.entries(draft.stock).forEach(([sz,q])=>{ if(q!==(p.stock[sz]||0)) hasChanges=true; });
  });

  async function saveStock(){
    window._stockDraft.forEach(draft=>{
      const p=S.products.find(x=>x.id===draft.id);
      if(p) p.stock={...draft.stock};
    });
    lsSet("gs_prod",S.products); window._stockDraft=null; render();
    const ok=await persistProducts(true);
    toast(ok?"✅ Estoque salvo e sincronizado!":"✅ Salvo localmente. ⚠️ Verifique a conexão."); render();
  }

  return ce("div",{},
    ce("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}},
      ce("h3",{style:{fontSize:"17px"}},"📦 Estoque"),
      ce("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},
        S.scriptUrl?ce("button",{class:"btn",style:{padding:"6px 14px",fontSize:"12px",borderRadius:"20px",background:"#e3f2fd",color:"#1565c0"},
          onclick:()=>loadFromSheets(true)},"🔄 Sincronizar"):null,
        hasChanges?ce("button",{class:"btn",style:{padding:"8px 18px",fontSize:"13px",borderRadius:"22px",background:"#e53935",color:"#fff"},
          onclick:()=>{window._stockDraft=null;render();}},"Descartar"):null,
        ce("button",{class:"btn",style:{padding:"8px 18px",fontSize:"13px",borderRadius:"22px",background:"#4caf50",color:"#fff"},
          onclick:saveStock},"💾 Salvar estoque")
      )
    ),
    ...S.products.map(p=>{
      const draft=getDraft(p.id)||{stock:{...p.stock}};
      const totalDraft=Object.values(draft.stock).reduce((s,q)=>s+q,0);
      return ce("div",{class:"card"},
        ce("div",{style:{display:"flex",gap:"14px",alignItems:"center",marginBottom:"14px"}},
          ce("div",{style:{width:"70px",height:"70px",borderRadius:"10px",overflow:"hidden",background:"#eee",flexShrink:0}},
            p.image?ce("img",{src:p.image,alt:p.name,style:{width:"100%",height:"100%",objectFit:"cover"}}):
                    ce("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",fontSize:"30px"}},"👠")),
          ce("div",{style:{flex:1}},
            ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"2px"}},p.name),
            ce("div",{style:{fontSize:"11px",color:"#aaa",marginBottom:"4px"}},`${p.code?p.code+" • ":""}${p.gender}`),
            ce("div",{style:{fontSize:"13px",fontWeight:700,color:PINK}},`${totalDraft} un. total`))
        ),
        ce("div",{style:{display:"flex",flexWrap:"wrap",gap:"10px"}},
          ...Object.entries(draft.stock).sort((a,b)=>+a[0]-+b[0]).map(([sz,qty])=>{
            const changed=(qty!==(p.stock[sz]||0));
            return ce("div",{style:{textAlign:"center",minWidth:"52px"}},
              ce("div",{style:{fontSize:"11px",fontWeight:600,color:changed?"#e91e8c":"#888",marginBottom:"3px"}},`Nº ${sz}`),
              ce("div",{style:{display:"flex",alignItems:"center",gap:"3px"}},
                ce("button",{class:"qty-btn qty-sm",onclick:()=>{draft.stock[sz]=Math.max(0,qty-1);render();}},"−"),
                ce("span",{style:{fontWeight:700,fontSize:"14px",minWidth:"22px",textAlign:"center",
                  color:qty===0?"#e53935":qty<=2?"#ff9800":"#2e7d32"}},qty),
                ce("button",{class:"qty-btn qty-sm",onclick:()=>{draft.stock[sz]=qty+1;render();}},"+")
              )
            );
          })
        )
      );
    }),
    ce("div",{style:{display:"flex",gap:"10px",marginTop:"8px",justifyContent:"flex-end"}},
      hasChanges?ce("button",{class:"btn",style:{padding:"8px 18px",fontSize:"13px",borderRadius:"22px",background:"#e53935",color:"#fff"},
        onclick:()=>{window._stockDraft=null;render();}},"Descartar alterações"):null,
      ce("button",{class:"btn",style:{padding:"10px 22px",fontSize:"14px",borderRadius:"22px",background:"#4caf50",color:"#fff"},
        onclick:saveStock},"💾 Salvar e sincronizar")
    )
  );
}

// ─── AFILIADOS ───────────────────────────────────────────────────────────────
function afiStats(a){
  const ords=S.orders.filter(o=>o.ref===a.codigo&&o.status!=="cancelled");
  const conf=ords.filter(o=>o.status==="confirmed");
  const com=o=>+o.comissao||Math.round(o.total*(+a.comissao||0))/100;
  const aPagar=conf.filter(o=>!o.comissaoPaga);
  return {pedidos:ords.length,vendas:conf.length,faturado:conf.reduce((s,o)=>s+o.total,0),
          comissaoTotal:conf.reduce((s,o)=>s+com(o),0),aPagar:aPagar.reduce((s,o)=>s+com(o),0),aPagarOrds:aPagar};
}
async function saveAfiliados(msg){
  lsSet("gs_afi",S.afiliados);
  const ok=await _post({action:"saveAfiliados",afiliados:S.afiliados});
  toast(ok?(msg||"✅ Afiliados salvos!"):"⚠️ Erro ao salvar na planilha.",ok?3000:4500); render();
}
function slugAfi(nome){
  const base=nome.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,16)||"afiliado";
  let c=base,n=2; while(S.afiliados.some(a=>a.codigo===c)) c=base+(n++);
  return c;
}
function buildAfiliados(){
  if(!S.afiForm) S.afiForm={nome:"",whatsapp:"",pix:"",comissao:"10"};
  const f=S.afiForm;
  const inp=(id,label,key,ph,type="text")=>{
    const i=ce("input",{type,class:"inp",id,placeholder:ph}); i.value=f[key];
    i.addEventListener("input",e=>S.afiForm[key]=e.target.value);
    return ce("div",{},ce("label",{style:{fontWeight:600,fontSize:"12px",display:"block",marginBottom:"4px"}},label),i);
  };
  const tot=S.afiliados.reduce((acc,a)=>{const t=afiStats(a);acc.v+=t.vendas;acc.f+=t.faturado;acc.p+=t.aPagar;return acc;},{v:0,f:0,p:0});
  return ce("div",{},
    ce("h3",{style:{marginBottom:"14px",fontSize:"17px"}},"🤝 Afiliados"),
    ce("div",{class:"kpi-grid",style:{marginBottom:"16px"}},
      mkKPI("🤝","Afiliados ativos",S.afiliados.filter(a=>a.ativo).length,"#e0f2f1","#00695c"),
      mkKPI("🛍","Vendas confirmadas",tot.v,"#e8f5e9","#2e7d32"),
      mkKPI("💰","Faturado",fmt(tot.f),"#fce4ec","#ad1457"),
      mkKPI("⏳","Comissão a pagar",fmt(tot.p),"#fff3e0","#e65100")),
    ce("div",{class:"card"},
      ce("div",{style:{fontWeight:700,fontSize:"14px",marginBottom:"10px"}},"Novo afiliado"),
      ce("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:"10px"}},
        inp("afi-nome","Nome","nome","Ex: Ana Paula"),
        inp("afi-wa","WhatsApp","whatsapp","96 99999-9999"),
        inp("afi-pix","Chave Pix","pix","CPF, e-mail ou telefone"),
        inp("afi-com","Comissão (%)","comissao","10","number")),
      ce("button",{class:"btn",style:{marginTop:"12px",background:PINK,color:"#fff"},onclick:()=>{
        if(!f.nome.trim()) return toast("Informe o nome do afiliado!");
        const pct=+f.comissao; if(!(pct>0&&pct<=50)) return toast("Comissão entre 1% e 50%.");
        S.afiliados.push({codigo:slugAfi(f.nome),nome:f.nome.trim(),whatsapp:f.whatsapp.trim(),pix:f.pix.trim(),comissao:pct,ativo:true,criado:toDay()});
        S.afiForm=null; saveAfiliados("✅ Afiliado cadastrado!");
      }},"Cadastrar afiliado")),
    S.afiliados.length===0?ce("div",{style:{color:"#aaa",textAlign:"center",padding:"30px 0"}},"Nenhum afiliado cadastrado ainda."):null,
    ...S.afiliados.map(a=>{
      const t=afiStats(a);
      const link=`${CATALOG_URL}/varejo?ref=${a.codigo}`;
      return ce("div",{class:"card",style:{opacity:a.ativo?1:.6}},
        ce("div",{style:{display:"flex",justifyContent:"space-between",gap:"10px",flexWrap:"wrap",alignItems:"flex-start"}},
          ce("div",{style:{minWidth:0,flex:"1 1 240px"}},
            ce("div",{style:{fontWeight:700,fontSize:"14px"}},a.nome,
              ce("span",{style:{marginLeft:"8px",fontSize:"11px",color:"#888",fontWeight:400}},`${a.comissao}% • código ${a.codigo}`),
              a.ativo?null:ce("span",{style:{marginLeft:"6px",fontSize:"10px",background:"#555",color:"#fff",borderRadius:"10px",padding:"2px 8px"}},"INATIVO")),
            ce("div",{style:{fontSize:"12px",color:"#888",marginTop:"2px"}},`${a.whatsapp||"sem WhatsApp"} • Pix: ${a.pix||"não informado"}`),
            ce("div",{style:{fontSize:"12px",marginTop:"8px",wordBreak:"break-all",color:"#1565c0"}},link)),
          ce("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap"}},
            ce("button",{class:"btn",style:{padding:"5px 12px",fontSize:"12px",background:"#e3f2fd",color:"#1565c0"},onclick:async()=>{
              try{ await navigator.clipboard.writeText(link); toast("🔗 Link copiado!"); }catch(e){ prompt("Copie o link:",link); }
            }},"Copiar link"),
            ce("button",{class:"btn",style:{padding:"5px 12px",fontSize:"12px",background:"#f0f0f0",color:"#1a1a2e"},onclick:()=>{
              const v=prompt(`Nova comissão de ${a.nome} (%)`,a.comissao); if(v===null) return;
              const n=+String(v).replace(",","."); if(!(n>0&&n<=50)) return toast("Comissão entre 1% e 50%.");
              a.comissao=n; saveAfiliados("✅ Comissão atualizada!");
            }},"Alterar %"),
            ce("button",{class:"btn",style:{padding:"5px 12px",fontSize:"12px",background:a.ativo?"#eceff1":"#e8f5e9",color:a.ativo?"#37474f":"#2e7d32"},
              onclick:()=>{a.ativo=!a.ativo;saveAfiliados(a.ativo?"✅ Afiliado reativado!":"Afiliado desativado.");}},a.ativo?"Desativar":"Reativar"))),
        ce("div",{style:{display:"flex",gap:"16px",flexWrap:"wrap",fontSize:"12px",marginTop:"10px",paddingTop:"10px",borderTop:"1px solid #eee"}},
          ce("span",{},`Pedidos: `,ce("b",{},t.pedidos)),
          ce("span",{},`Vendas confirmadas: `,ce("b",{},t.vendas)),
          ce("span",{},`Faturado: `,ce("b",{},fmt(t.faturado))),
          ce("span",{},`Comissão total: `,ce("b",{},fmt(t.comissaoTotal))),
          ce("span",{style:{color:t.aPagar>0?"#e65100":"#2e7d32"}},`A pagar: `,ce("b",{},fmt(t.aPagar)))),
        t.aPagar>0?ce("button",{class:"btn",style:{marginTop:"10px",padding:"7px 16px",fontSize:"12px",background:"#4caf50",color:"#fff"},
          onclick:async()=>{
            if(!confirm(`Confirma que pagou ${fmt(t.aPagar)} de comissão para ${a.nome}?`)) return;
            t.aPagarOrds.forEach(o=>{ if(!o.comissao) o.comissao=Math.round(o.total*(+a.comissao||0))/100; o.comissaoPaga=true; });
            const ok=await persistOrders(true); if(ok) toast("✅ Comissão marcada como paga!");
          }},`✅ Marcar ${fmt(t.aPagar)} como pago`):null);
    }));
}

// ─── CONFIG ───────────────────────────────────────────────────────────────────
function buildConfig(){
  const scriptInp=ce("input",{type:"text",class:"inp",placeholder:"https://script.google.com/macros/s/...",
    style:{marginBottom:"12px"}});
  scriptInp.value=S.scriptInput;
  scriptInp.addEventListener("input",e=>S.scriptInput=e.target.value);
  return ce("div",{},
    ce("h3",{style:{marginBottom:"16px",fontSize:"17px"}},"⚙️ Configurações"),
    ce("div",{class:"card"},
      ce("div",{style:{fontWeight:700,fontSize:"14px",color:PINK,marginBottom:"8px"}},"URL do Google Apps Script"),
      ce("p",{style:{fontSize:"13px",color:"#888",marginBottom:"12px"}},
        "Cole aqui a URL do Apps Script para sincronizar dados com a planilha."),
      scriptInp,
      ce("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},
        ce("button",{class:"btn",style:{background:PINK,color:"#fff"},
          onclick:()=>{
            S.scriptUrl=S.scriptInput;
            lsSet("gs_script",S.scriptInput);
            lsSet("appsScriptUrl",S.scriptInput);
            toast("URL salva!"); render();
          }},"Salvar URL"),
        S.scriptUrl?ce("button",{class:"btn",style:{background:"#e3f2fd",color:"#1565c0"},
          onclick:()=>loadFromSheets(true)},"🔄 Sincronizar agora"):null
      ),
      S.scriptUrl?ce("div",{style:{marginTop:"8px",fontSize:"12px",color:"#2e7d32"}},
        `✅ Conectado${S.lastSync?" • Última sync: "+S.lastSync:""}`):null,
      S.syncError?ce("div",{style:{marginTop:"6px",fontSize:"12px",color:"#e53935"}},`❌ ${S.syncError}`):null
    ),
    (()=>{
      const np=ce("input",{type:"password",class:"inp",id:"cfg-newpass",placeholder:"Nova senha (mínimo 6 caracteres)",style:{marginBottom:"10px"}});
      return ce("div",{class:"card"},
        ce("div",{style:{fontWeight:700,fontSize:"14px",color:PINK,marginBottom:"8px"}},"Senha do Admin"),
        ce("p",{style:{fontSize:"13px",color:"#888",marginBottom:"10px"}},"A senha fica guardada no Google, fora do site."),
        np,
        ce("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap"}},
          ce("button",{class:"btn",style:{background:PINK,color:"#fff"},onclick:async()=>{
            const d=await _call({action:"changePass",newPass:np.value});
            toast(d.ok?"✅ Senha alterada!":(d.error||"Erro ao trocar a senha"),4000); if(d.ok) np.value="";
          }},"Trocar senha"),
          ce("button",{class:"btn",style:{background:"#eee",color:"#1a1a2e"},onclick:async()=>{
            await _call({action:"logout"}); logoutLocal(""); go("catalog"); toast("Você saiu do Admin.");
          }},"Sair do Admin")));
    })(),
    ce("div",{class:"card"},
      ce("div",{style:{fontWeight:700,fontSize:"14px",color:PINK,marginBottom:"8px"}},"Planilha de Produtos"),
      ce("p",{style:{fontSize:"13px",color:"#888",marginBottom:"10px"}},"Acesse a planilha para ver ou editar dados diretamente."),
      ce("a",{href:`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`,target:"_blank",
        style:{color:PINK,fontWeight:600,fontSize:"13px"}},"Abrir planilha no Google Sheets →")
    ),
    ce("div",{class:"card"},
      ce("div",{style:{fontWeight:700,fontSize:"14px",color:"#e53935",marginBottom:"8px"}},"Resetar dados locais"),
      ce("p",{style:{fontSize:"13px",color:"#888",marginBottom:"12px"}},
        "Apaga todos os dados salvos localmente. Os dados na planilha não são afetados."),
      ce("button",{class:"btn",style:{background:"#e53935",color:"#fff"},
        onclick:()=>{
          if(confirm("Tem certeza? Esta ação apaga os dados locais.")){
            localStorage.clear(); location.reload();
          }
        }},"Resetar dados locais")
    )
  );
}

// ═══════════════════════════════════════════════════════════════════════════
// INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════════════════
captureRef();
if(!S.token) logoutLocal("");   // visitante não guarda pedidos nem clientes no aparelho
render();

checkPaymentReturn();
if(S.scriptUrl) loadFromSheets(false);

// Aviso quando o site foi atualizado e este aparelho está com a versão antiga
let _verAtual=null;
async function checkNewVersion(){
  try{
    const t=await (await fetch("/",{cache:"no-store"})).text();
    const m=t.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if(m&&m[1]!==APP_VERSION&&!document.getElementById("upd-bar")){
      const bar=ce("div",{id:"upd-bar",style:{position:"fixed",left:"0",right:"0",bottom:"0",zIndex:"9000",background:"#1a1a2e",color:"#fff",
        padding:"12px 16px",display:"flex",gap:"10px",alignItems:"center",justifyContent:"center",flexWrap:"wrap",fontSize:"14px"}},
        "Há uma versão nova do site.",
        ce("button",{class:"btn",style:{background:PINK,color:"#fff",padding:"7px 16px"},onclick:()=>location.reload()},"Atualizar agora"));
      document.body.appendChild(bar);
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkNewVersion(); });
setInterval(checkNewVersion,600000);

// Sync automático a cada 30 minutos (silencioso)
setInterval(()=>{ if(S.scriptUrl&&!S.syncing) loadFromSheets(false); }, 1800000);

</script>
